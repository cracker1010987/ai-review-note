async function startBatch(){
  const a=state.add, sel=a.regions.filter(r=>r.on);
  const items=[]; for(const r of sel){ try{ items.push({img:await cropImage(a.imgs.q,r), number:r.number}); }catch(e){} }
  if(!items.length) return;
  state.batch={ items, idx:0, saved:0, base:{courseId:a.courseId, subjectId:a.subjectId, leafId:a.leafId, workbook:a.meta.workbook, page:a.meta.page, sImg:a.imgs.s} };
  batchRun();
}
function batchRun(){
  const B=state.batch, it=B.items[B.idx], b=B.base;
  state.add={ step:'info', courseId:b.courseId, subjectId:b.subjectId, leafId:b.leafId, imgs:{q:it.img, s:b.sImg||null, mine:null},
    meta:{workbook:b.workbook, page:b.page, number:it.number, tags:[]}, draft:null, err:null, prog:0, editing:false, figOn:false, crop:null, run:0, multi:false };
  runRead();
}
function batchNext(){
  const B=state.batch;
  if(B.idx+1<B.items.length){ B.idx++; batchRun(); return; }
  const b=B.base, n=B.saved; state.batch=null; state.add=null;
  state.filters={...emptyFilters(), course:b.courseId, subject:b.subjectId, workbook:(b.workbook||'').trim()};
  tab('notes'); toast(n?`${n}문제를 저장했어요`:'저장한 문제가 없어요');
}
const batchTag = () => state.batch ? ` (${state.batch.idx+1}/${state.batch.items.length})` : '';
function emptyDraft(a){ return { problem:'', choices:[], answer:'', answerIndex:null, mine:'', mineIndex:null, leafId:a.leafId||null, type:'', typeExisting:false,
  concepts:[], steps:[], key:'', mistake:'', figure:null, similar:[], suggest:[], workbook:a.meta.workbook, page:a.meta.page, number:a.meta.number, tags:[...a.meta.tags] }; }
function validBox(f){ if(!f||typeof f!=='object') return null; const b={x:+f.x,y:+f.y,w:+f.w,h:+f.h}; if(Object.values(b).some(v=>!isFinite(v))||b.w<3||b.h<3) return null;
  b.x=Math.max(0,Math.min(97,b.x)); b.y=Math.max(0,Math.min(97,b.y)); b.w=Math.min(b.w,100-b.x); b.h=Math.min(b.h,100-b.y); return b; }
function draftFromAI(r, a){
  const s=subjectById(a.subjectId), choices=arr(r.choices).map(String).filter(Boolean);
  const leafOk=leafOf(s, r.leaf_id) ? r.leaf_id : (a.leafId||null);
  const ai=intOrNull(r.answer_index), mi=intOrNull(r.mine_index);
  return { ...emptyDraft(a), problem:String(r.problem||''), choices,
    answerIndex: ai!==null&&ai<choices.length?ai:null, answer:String(r.answer??(ai!==null?choices[ai]:'')??''),
    mineIndex: mi!==null&&mi<choices.length?mi:null, mine:r.mine==null?'':String(r.mine),
    leafId:leafOk, type:String(r.type||'').trim(), typeExisting:!!r.type_is_existing, concepts:arr(r.concepts).map(String),
    steps:arr(r.steps).map(String), key:String(r.key||''), mistake:String(r.mistake_point||''), figure:validBox(r.figure),
    suggest:arr(r.suggested_tags).map(String).filter(t=>DB.settings.tagPresets.includes(t) && !a.meta.tags.includes(t)) };
}
function addBack(){
  const a=state.add; if(!a){ back(); return; }
  if(state.batch){ if(!confirm(`남은 ${state.batch.items.length-state.batch.idx}문제 정리를 그만둘까요? 이미 저장한 문제는 남아요.`)) return; a.run++; const n=state.batch.saved; state.batch=null; state.add=null; back(); if(n) toast(`${n}문제를 저장했어요`); return; }
  if(a.step==='crop' || a.step==='regions'){ a.step='info'; render(true); return; }
  if(a.step==='reading'){ a.run++; a.step='info'; render(true); return; }
  if(a.step==='confirm'){ if(!confirm('읽은 문제를 버리고 사진 단계로 돌아갈까요?')) return; a.read=null; a.step='info'; render(true); return; }
  if(a.step==='analyze'){ a.run++; a.step=a.read?'confirm':'info'; render(true); return; }
  if(a.step==='result'){ if(!confirm('정리한 내용을 저장하지 않고 돌아갈까요?')) return; a.step=a.read?'confirm':'info'; render(true); return; }
  const typed=Object.values(a.imgs||{}).some(Boolean) || (a.meta&&(a.meta.tags.length||String(a.meta.page||'').trim()||String(a.meta.number||'').trim()));
  if(typed && !confirm('넣은 사진과 입력한 내용이 사라져요. 그래도 나갈까요?')) return;
  state.add=null; back();
}
function renderAdd(){
  const a=state.add; if(!a) return redirectHome();
  if(a.step==='info') return renderAddInfo(a);
  if(a.step==='crop') return renderCropStep(a);
  if(a.step==='regions') return renderRegions(a);
  if(a.step==='reading') return renderReading(a);
  if(a.step==='confirm') return renderConfirm(a);
  if(a.step==='analyze') return renderAnalyze(a);
  return renderResult(a);
}

function manualNote(){ const a=state.add; if(!a.subjectId){ toast('과목을 먼저 골라주세요'); return; } a.draft=emptyDraft(a); a.step='result'; a.editing=true; a.figOn=false; a.crop={x:15,y:30,w:70,h:45}; render(true); }
async function runRead(){
  const a=state.add, run=++a.run, alive=()=>state.add===a && a.run===run && route.name==='add';
  const s=subjectById(a.subjectId); if(!s) return;
  a.step='reading'; a.err=null; a.read=null; render(true);
  try{
    const r=await AI.task('readProblem',{images:[a.imgs.q].filter(Boolean), number:a.meta.number, courseId:a.courseId});
    if(!alive()) return;
    const choices=arr(r.choices).map(c=>String(c).trim()).filter(Boolean), mi=intOrNull(r.mine_index);
    a.read={ problem:String(r.problem||'').trim(), choices, figure:validBox(r.figure), mineIndex:mi!==null&&mi<choices.length?mi:null,
      uncertain:arr(r.uncertain).map(x=>String(x).trim()).filter(x=>x&&x.length<=60).slice(0,6), showPhoto:false };
    if(!a.read.problem) throw new Error('사진에서 문제를 읽지 못했어요. 더 밝고 선명하게 찍어주세요.');
    const mode=DB.settings.confirmRead;
    if(mode==='never' || (mode==='unsure' && !a.read.uncertain.length)){ runSolve(); return; }
    a.readEdit=false; a.zoom=false; a.step='confirm'; render(true);
  }catch(e){ if(!alive()) return; a.err=e.message; render(); }
}
function renderReading(a){
  appbar('문제 읽는 중'+batchTag(),{backFn:'addBack()'});

}
// 자신 없는 조각 표시: 일반 글은 그 조각만, 수식 안이면 수식 전체를 노랗게
function markUnsure(text, list){
  const parts=String(text).split(/(\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\$[^$]*\$)/);
  const marked=parts.map(()=>false); let html=parts.map(x=>esc(x));
  for(const u of list||[]){
    const eu=esc(u); let done=false;
    for(let k=0;k<parts.length&&!done;k+=2){ if(html[k].includes(eu)){ html[k]=html[k].split(eu).join(`\u0001${eu}\u0002`); done=true; } }
    for(let k=1;k<parts.length&&!done;k+=2){ if(parts[k].includes(u)){ marked[k]=true; done=true; } }
  }

function bindCrop(crop){ const wrap=$('#cropwrap'), box=$('#cropbox'); if(wrap&&box&&crop) bindBox(wrap, box, crop); }
function bindRegions(list){ const wrap=$('#cropwrap'); if(!wrap) return; wrap.querySelectorAll('.cropbox.m').forEach(b=>{ const r=list[+b.dataset.i]; if(r) bindBox(wrap,b,r); }); }
function bindBox(wrap, box, crop){
  const h=box.querySelector('.h');
  let mode=null, sx, sy, start;
  const down=m=>e=>{ e.preventDefault(); e.stopPropagation(); mode=m; sx=e.clientX; sy=e.clientY; start={...crop}; box.setPointerCapture(e.pointerId); };
  box.addEventListener('pointerdown', down('move'));
  if(h) h.addEventListener('pointerdown', down('resize'));
  box.addEventListener('pointermove', e=>{
    if(!mode) return; const r=wrap.getBoundingClientRect();
    const dx=(e.clientX-sx)/r.width*100, dy=(e.clientY-sy)/r.height*100;
    if(mode==='move'){ crop.x=Math.min(Math.max(0,start.x+dx),100-crop.w); crop.y=Math.min(Math.max(0,start.y+dy),100-crop.h); }
    else { crop.w=Math.min(Math.max(10,start.w+dx),100-crop.x); crop.h=Math.min(Math.max(8,start.h+dy),100-crop.y); }
    Object.assign(box.style,{left:crop.x+'%',top:crop.y+'%',width:crop.w+'%',height:crop.h+'%'});
  });
  const up=()=>{ mode=null; };
  box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
}

const newSession=(items,single)=>({items, idx:0, results:[], cur:null, loading:false, err:null, picked:null, revealed:false, text:'', grading:false, graded:null, ok:null, single});
function practice(id, simIdx){ state.review=newSession([{kind:'note',noteId:id,...(simIdx!=null?{simIdx}:{})}],true); go('practice'); }
async function genSimilar(id){
  const n=noteById(id); if(!n||state.simBusy) return;
  const lv=state.simLv||DB.settings.simLevel||'same';
  state.simBusy={id, err:null}; render();
  try{
    const sims=await makeVerifiedSimilar(n,(subjectById(n.subjectId)||{}).name||'',null,n.courseId,lv);
    if(!sims.length) throw new Error('AI가 만든 문제를 다시 풀었더니 답이 달라서 버렸어요. 한 번 더 눌러보세요.');
    n.similar.push(sims[0]); save(); state.simBusy=null;
    practice(id, n.similar.length-1);
  }catch(e){ state.simBusy={id, err:e.message}; if(route.name==='note') render(); }
}
function startQuiz(sid,lid){ state.review=newSession([{kind:'concept',sid,lid}],true); go('practice'); }
function leafCtx(sid,lid){

  const prev=DB.stats.quizzes.filter(q=>q.lid===lid&&q.q).slice(-5).map(q=>q.q);

}

      R.genErr=null;
      if(!n.similar.length && AI.ready() && DB.settings.makeSimilar && it.simIdx==null){
        try{ const sims=await makeVerifiedSimilar(n,(subjectById(n.subjectId)||{}).name||'',null,n.courseId); if(sims.length){ n.similar=sims; save(); } else R.genErr='검산에서 답이 맞지 않았어요.'; }
        catch(e){ R.genErr=e.message; }
      }
      if(n.similar.length){ const q=(it.simIdx!=null&&n.similar[it.simIdx])||n.similar[n.history.length % n.similar.length];
        R.cur={src:'similar', level:q.level, text:q.text, choices:q.choices, answer:q.answer, answerIndex:intOrNull(q.answer_index), solution:q.solution, note:n}; }
      else R.cur={src:'original', text:n.problem, choices:n.choices, answer:n.answer, answerIndex:n.answerIndex, solution:n.steps.join(' '), note:n, fig:n.imgs.fig};
    } else {
      const ctx=leafCtx(it.sid,it.lid);
      if(!ctx){ R.idx++; R.loading=false; if(state.review===R) render(); return; }
      const q=await AI.task('conceptQuiz',ctx), choices=arr(q.choices).map(String);
      const kind=q.kind==='short'||!choices.length?'short':'choice';
      R.cur={src:'concept', kind, text:String(q.question||''), choices:kind==='choice'?choices:[], answerIndex:intOrNull(q.answer_index), answer:String(q.answer||''), solution:String(q.explanation||''), ctx};
    }
  }catch(e){ R.err=e.message; }
  R.loading=false; if(state.review===R) render();
}
function answer(ok){
  const R=state.review; if(R.ok!==null) return;
  R.ok=ok; R.results.push(ok);
  const it=R.items[R.idx], t=ymd();
  if(it.kind==='note'){ const n=R.cur.note; R.grad=applySrs(n,ok); n.history.push({d:t,ok}); DB.stats.reviews.push({d:t,ok,nid:n.id,...(R.exam?{ex:R.exam}:{})}); }
  else DB.stats.quizzes.push({d:t,sid:it.sid,lid:it.lid,ok,q:R.cur.text.slice(0,80)});
  save(); render();
}
function dontKnow(){ const R=state.review; if(R.ok!==null||R.grading) return; R.picked=null; R.dunno=true; answer(false); }
function pickOpt(i){ const R=state.review; if(R.ok!==null) return; R.picked=i; answer(i===R.cur.answerIndex); }
async function gradeShort(){
  const R=state.review, c=R.cur;
  if(!R.text.trim()){ toast('답을 먼저 써주세요'); return; }
  R.grading=true; render();
  try{ const g=await AI.task('gradeAnswer',{q:c.text, model:c.answer, student:R.text, courseId:c.ctx&&c.ctx.courseId}); if(state.review!==R) return; R.graded={correct:!!g.correct, score:g.score, feedback:String(g.feedback||'')}; R.grading=false; answer(!!g.correct); }
  catch(e){ R.grading=false; render(); toast(e.message); }
}
function nextItem(){ const R=state.review; Object.assign(R,{idx:R.idx+1, cur:null, err:null, picked:null, revealed:false, text:'', graded:null, ok:null, grad:false, dunno:false}); render(true); }
function renderReview(){
  const single=route.name==='practice';
  if(!single && (!state.review || state.review.single)) state.review=newSession(reviewQueue(),false);
  const R=state.review;
  if(!R){ return redirectHome(); }
  const firstKind=R.items[0]&&R.items[0].kind;
  appbar(single?(R.title||(firstKind==='concept'?'개념 질문':'다시 풀기')):'오늘 복습',{back:single,actions:single?'':gearBtn()});
  if(!R.items.length){
    const next=DB.notes.map(n=>n.srs.due).sort()[0];
    return `<div class="done-card"><span class="pen">오늘 복습 끝!</span><p>${DB.notes.length?`다음 복습은 ${dueLabel(next)}이에요.`:'아직 모은 오답이 없어요.'}</p><button class="btn primary" onclick="startAdd()">오답 추가하기</button></div>`;
  }
  if(R.idx>=R.items.length){
    const right=R.results.filter(Boolean).length;
    return `<div class="done-card"><span class="pen">${right} / ${R.results.length} 정답</span><p>맞힌 문제는 복습 간격이 길어지고, 틀린 문제는 내일 다시 나와요.</p><button class="btn primary" onclick="${single?'back()':"tab('home')"}">${single?'돌아가기':'홈으로'}</button></div>`;
  }
  const it=R.items[R.idx];
  const bars=R.items.length>1?`<div class="progress">${R.items.map((_,i)=>`<i class="${i<=R.idx?'on':''}"></i>`).join('')}</div>`:'';
  if(!R.cur && !R.loading && !R.err){ R.loading=true; setTimeout(()=>loadItem(R)); }
  if(R.loading) return `${bars}<div class="loading"><div class="spin"></div>${it.kind==='concept'?'약한 개념을 찾아 질문을 만드는 중이에요':'비슷한 문제를 준비하는 중이에요'}<p class="explain">${AI.ready()?'AI가 문제를 만들고 검산까지 하면 10~40초쯤 걸려요.':''}</p></div>`;
  if(R.err) return `${bars}<div class="err"><b>문제를 준비하지 못했어요</b><p>${esc(R.err)}</p><div class="acts"><button class="btn ghost" onclick="state.review.results.push(null);nextItem()">건너뛰기</button><button class="btn primary" onclick="state.review.err=null;render()">다시 시도</button></div></div>`;
  const c=R.cur, n=c.note, answered=R.ok!==null;
  const from = it.kind==='concept'
    ? `개념 질문 · ${esc(c.ctx.path.replace(/ > /g,' › '))}`
    : `${esc(leafName(n))} / ${esc(n.type)} ${c.src==='similar'?`<span class="badge ok">유사문제${c.level&&c.level!=='same'?' · '+SIM_LABEL[c.level]:''}</span>`:'<span class="badge match">원래 문제 다시 풀기</span>'}`;
  let ctl='';
  if(c.choices.length){
    ctl=`<div class="opts">${c.choices.map((ch,i)=>{ let cls='',mark='';
      if(answered){ if(i===c.answerIndex){cls='right';mark='<span class="mark pen" style="color:var(--ok)">✓</span>';} else if(i===R.picked){cls='wrong';mark='<span class="mark pen" style="color:var(--red)">✕</span>';} }
      return `<button class="opt ${cls}" ${answered?'disabled':''} onclick="pickOpt(${i})"><span class="n">${i+1}</span><span>${esc(ch)}</span>${mark}</button>`; }).join('')}</div>${answered?'':`<button class="btn ghost block dunno" onclick="dontKnow()">모르겠어요</button><p class="help" style="text-align:center;margin-top:6px">찍어서 맞히면 모르는 문제가 복습에서 빠질 수 있어요.</p>`}`;
  } else if(c.src==='concept'){
    ctl = answered ? `<div class="card"><b>내 답</b><p style="margin:4px 0 0;white-space:pre-wrap">${R.dunno?'모르겠어요':esc(R.text)}</p></div>`
      : `<textarea class="input" rows="4" aria-label="내 답" placeholder="자기 말로 설명해보세요" oninput="state.review.text=this.value" style="margin-top:12px">${esc(R.text)}</textarea>
         <button class="btn primary block" style="margin-top:8px" onclick="gradeShort()" ${R.grading?'disabled':''}>${R.grading?'채점하는 중…':'채점받기'}</button>${R.grading?'':`<button class="btn ghost block dunno" onclick="dontKnow()">모르겠어요</button>`}`;
  } else if(!answered){
    ctl = R.revealed
      ? `<div class="card" style="margin-top:12px"><b style="color:var(--red)">정답</b> ${esc(c.answer||'미입력')}</div><p class="hint">내 답과 비교해서 골라주세요.</p><div class="row2"><button class="btn ghost" onclick="answer(false)">틀렸어요</button><button class="btn primary" onclick="answer(true)">맞았어요</button></div>`
      : `<p class="hint">노트에 풀어본 뒤 정답을 확인하세요.</p><button class="btn primary block" onclick="state.review.revealed=true;render()">정답 확인</button>`;
  }
  let verdict='';
  if(answered){
    const ok=R.ok;
    const msg = R.dunno ? (it.kind==='concept'?'괜찮아요. 아래 모범 답과 해설을 읽고, 단원 개념 정리도 한 번 봐요.':'모르는 문제로 표시했어요. 아래 풀이를 읽어보고, 내일 다시 풀어봐요.')
      : it.kind==='concept' ? (ok?'개념을 잘 이해하고 있어요.':'단원 개념 정리를 한 번 더 읽어보면 좋아요.')
      : R.grad ? `연속 ${DB.settings.gradCount}번 맞혀서 이 오답은 졸업했어요. 이제 복습에 나오지 않아요.`
      : (ok?`다음 복습은 ${dueLabel(n.srs.due)}예요. 연속 ${n.srs.streak}번 맞힘 (${DB.settings.gradCount}번이면 졸업)`:'내일 다시 나와요. 원래 오답에서 기억할 것을 다시 읽어보세요.');
    verdict=`<div class="verdict ${ok?'good':R.dunno?'unsure':'bad'}"><span class="pen" style="color:${ok?'var(--ok)':'var(--red)'}">${R.grad?'졸업!':ok?'맞았어요':R.dunno?'모르는 문제':'다시 볼 문제'}</span><p>${msg}</p></div>
      <div class="note">
        ${R.graded?`<div class="sol"><h4>채점${R.graded.score!=null?' '+esc(R.graded.score)+'점':''}</h4><p>${esc(R.graded.feedback)}</p></div><hr class="divider">`:''}
        ${it.kind==='concept'&&c.answer?`<div class="sol"><h4>모범 답</h4><p>${esc(c.answer)}</p></div>`:''}
        <div class="sol"><h4>${it.kind==='concept'?'해설':'풀이'}</h4><p>${esc(c.solution||'풀이가 없어요')}</p></div>
        ${n&&n.key?`<div class="key"><span class="pen">원래 오답에서 기억할 것</span><mark>${esc(n.key)}</mark></div>`:''}
        ${it.kind==='concept'?`<button class="link" onclick="go('leaf',{sid:'${c.ctx.s.id}',lid:'${c.ctx.leaf.id}'})">단원 개념 정리 보기 ›</button>`:''}
      </div>
      <button class="btn primary block" onclick="nextItem()">${R.idx+1<R.items.length?'다음 문제':'결과 보기'}</button>`;
  }
  return `${bars}<div class="from">${from}</div>
    ${R.genErr&&c.src==='original'?`<p class="explain" style="margin-bottom:8px">유사문제를 만들지 못해 원래 문제로 복습해요. (${esc(R.genErr)})</p>`:''}
    <div class="note"><p class="qtext" style="margin:0">${esc(c.text)}</p>${c.fig?`<div class="fig" style="margin-top:10px"><img data-img="${c.fig}" alt="문제 그림"></div>`:''}</div>
    ${ctl}${verdict}`;
}

function barsHTML(rows){
  const max=Math.max(1,...rows.map(r=>r.n));
  return `<div class="bars">${rows.map((r,i)=>`<div class="bar ${i===0?'top':''} ${r.click?'click':''}" ${r.click?`role="button" tabindex="0" data-v="${esc(r.v||'')}" onclick="${r.click}" onkeydown="if(event.key==='Enter')this.click()"`:''}><div class="lbl"><span>${esc(r.label)}</span><b>${r.n}</b></div><div class="track"><div class="fill" style="width:${r.n/max*100}%"></div></div></div>`).join('')}</div>`;
}
function statTag(t){ state.filters={...emptyFilters(),tag:t}; tab('notes'); }
function statWb(w){ state.filters={...emptyFilters(),workbook:w}; tab('notes'); }
function weekData(){
  const from=addDays(-6), to=ymd(), inW=d=>d>=from&&d<=to;
  const ns=DB.notes.filter(n=>inW(ymd(new Date(n.createdAt))));
  const cnt=a=>{ const m={}; a.forEach(x=>m[x]=(m[x]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const rv=DB.stats.reviews.filter(r=>inW(r.d)), qz=DB.stats.quizzes.filter(q=>inW(q.d)), AD=activeDays();
  return { from, to, days:[...Array(7)].filter((_,i)=>AD.has(addDays(-i))).length, added:ns.length,
    tags:cnt(ns.flatMap(n=>n.tags)).slice(0,6), leaves:cnt(ns.map(n=>leafName(n))).slice(0,6), types:[...new Set(ns.map(n=>n.type))],
    rv:rv.length, rvOk:rv.filter(r=>r.ok).length, qz:qz.length, qzOk:qz.filter(q=>q.ok).length,
    grad:DB.notes.filter(n=>n.graduated&&inW(n.graduated)).length, due:reviewQueue().length };
}
async function makeReport(){

}

function priceInfo(p, m, needImg){

async function testAI(){

function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
async function exportData(){
  const images=await IDB.all().catch(()=>({}));
  const db=clone(DB); db.settings.keys={openai:'',claude:'',gemini:'',openrouter:''};
  DB.settings.lastBackup=ymd(); DB.settings.backupSnooze=''; save();
  download(`오답노트-백업-${ymd()}.json`, JSON.stringify({app:'odap-note', version:2, exportedAt:new Date().toISOString(), db, images}));
  toast('백업 파일을 저장했어요'); if(route.name==='home'||route.name==='settings') render();

async function importData(input){
  const f=input.files[0]; if(!f) return;
  try{
    const j=JSON.parse(await f.text());
    if(!j.db || !Array.isArray(j.db.courses) || !Array.isArray(j.db.notes)) throw new Error('오답노트 백업 파일이 아니에요');
    if(!confirm(`백업(${(j.exportedAt||'').slice(0,10)||'날짜 모름'}, 오답 ${j.db.notes.length}개)으로 지금 데이터를 바꿀까요? 지금 데이터는 사라져요.`)){ input.value=''; return; }
    const keys=DB.settings.keys; DB=j.db; migrate(); DB.settings.keys=keys;
    await IDB.clear(); IMG.clear();
    for(const [k,v] of Object.entries(j.images||{})) await IDB.put(k,v);
    save(); applyTheme(); state.review=null; tab('home'); toast('백업을 불러왔어요');
  }catch(e){ toast(e.message||'파일을 읽지 못했어요'); }
  input.value='';
}
function clearSamples(){
  const n=DB.notes.filter(x=>x.sample).length;
  if(!confirm(`예시 오답 ${n}개를 지울까요?`)) return;
  DB.notes=DB.notes.filter(x=>!x.sample); state.review=null; save(); render(); toast('예시 오답을 지웠어요');
}
async function resetAll(){
  if(!confirm('모든 교과, 오답, 사진, 설정(API 키 포함)을 지우고 처음 상태로 돌릴까요? 되돌릴 수 없어요.')) return;
  await IDB.clear().catch(()=>{}); IMG.clear(); DB=seed(); save(); applyTheme(); state.review=null; state.filters=emptyFilters(); tab('home'); toast('처음 상태로 돌렸어요');
}

function openHelp(topic){
  topic=topic||HELP_OF[route.name]||'start';
  if(!DB.settings.helpSeen){ DB.settings.helpSeen=true; save(); }
  if(route.name==='help'){ route.topic=topic; render(); return; }
  go('help',{topic});
}
function renderHelp(){
  appbar('사용법',{back:true});
  const t=route.topic||'start';
  setTimeout(()=>{ const el=document.getElementById('h_'+t); if(el && t!=='start') el.scrollIntoView({block:'start'}); },0);
  return `<p class="hint" style="margin-top:0">궁금한 기능을 눌러 펼쳐봐요. 어느 화면에서든 오른쪽 위 <b>?</b> 버튼을 누르면 그 화면 설명이 먼저 열려요.</p>`
   + HELP.map(([k,title,sub,items])=>{ const on=k===t;
    return `<div class="cv-item help-item ${on?'open':''}" id="h_${k}"><button class="cv-row" aria-expanded="${on}" onclick="route.topic=route.topic==='${k}'?'-':'${k}';render()"><span class="t"><b>${title}</b><small>${sub}</small></span><span class="chev ${on?'up':''}">›</span></button>
      ${on?`<div class="cv-body"><ol class="help-list">${items.map(([h,b])=>`<li><b>${h}</b><p>${b}</p></li>`).join('')}</ol></div>`:''}</div>`; }).join('')
   + `<button class="btn ghost block" style="margin-top:8px" onclick="tab('home')">홈으로</button>`;
}

const SCREENS={home:renderHome, course:renderCourse, exam:renderExam, concepts:renderConcepts, subject:renderSubject, leaf:renderLeaf, notes:renderNotes, note:renderNote,
  help:renderHelp, review:renderReview, practice:renderReview, stats:renderStats, settings:renderSettings, add:renderAdd, toc:renderToc, print:renderPrint};
function render(top){
  const fn=SCREENS[route.name]||renderHome;
  let html;
  try{ html=fn(); }
  catch(e){ console.error(e); html=`<div class="err"><b>화면을 그리지 못했어요</b><p>${esc(e.message)}</p><div class="acts"><button class="btn ghost" onclick="tab('home')">홈으로</button></div></div>`; }
  const sc=$('#screen'), keep=sc.scrollTop;
  sc.innerHTML=html; sc.scrollTop=top?0:keep;
  navbar(); hydrate(sc);
  const A=route.name==='add' && state.add;
  if(A && A.step==='result' && A.figOn) bindCrop(A.crop);
  if(A && A.step==='crop') bindCrop(A.cbox);
  if(A && A.step==='regions' && !A.detecting) bindRegions(A.regions);
  typeset(sc);
}

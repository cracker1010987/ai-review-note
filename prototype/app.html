<!DOCTYPE html>
<html lang="ko" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 오답노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']], processEscapes: true },
  svg: { fontCache: 'local' },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" defer></script>
<style>
:root{
  --paper:#F7F8FA; --surface:#FFFFFF; --grid:#E4E9F3; --ink:#1B2A4A; --muted:#5F6B85;
  --blue:#2747C9; --blue-soft:#E7ECFF; --red:#D6303B; --red-soft:#FDE8EA;
  --hl:rgba(255,222,64,.55); --line:#D8DEEA; --ok:#1E8C55; --ok-soft:#E3F5EB;
  --desk:#DCE2EE;
  --h0:var(--surface); --h1:#FDE3E5; --h2:#F3A3AA; --h3:#D6303B; --h3t:#fff;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131824; --surface:#1B2232; --grid:#222B3E; --ink:#E6EAF3; --muted:#9AA5BE;
    --blue:#8EA2FF; --blue-soft:#25304F; --red:#FF7272; --red-soft:#3A2228;
    --hl:rgba(255,214,0,.22); --line:#2C3549; --ok:#5ED39A; --ok-soft:#1D3328;
    --desk:#0C0F16; --h1:#3A2228; --h2:#7A3540; --h3:#FF7272; --h3t:#2a0d10; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131824; --surface:#1B2232; --grid:#222B3E; --ink:#E6EAF3; --muted:#9AA5BE;
  --blue:#8EA2FF; --blue-soft:#25304F; --red:#FF7272; --red-soft:#3A2228;
  --hl:rgba(255,214,0,.22); --line:#2C3549; --ok:#5ED39A; --ok-soft:#1D3328;
  --desk:#0C0F16; --h1:#3A2228; --h2:#7A3540; --h3:#FF7272; --h3t:#2a0d10; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:var(--desk);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,label:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.pen{font-family:"Nanum Pen Script","Comic Sans MS",cursive;font-weight:400}

/* frame */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}
.aside{max-width:300px;color:var(--muted);font-size:14px}
.aside h1{font-size:22px;color:var(--ink);margin:0 0 8px;line-height:1.35}
.aside p{margin:0 0 12px}
.aside .pen{font-size:26px;color:var(--red);line-height:1.1}
.phone{width:390px;height:820px;max-height:calc(100vh - 48px);background:var(--paper);
  border-radius:36px;border:10px solid #1a1d24;position:relative;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(10,20,50,.45)}
.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.statusbar{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;background:var(--paper);flex:none}
.appbar{display:flex;align-items:center;gap:6px;padding:8px 10px 10px 12px;background:var(--paper);flex:none;border-bottom:1px solid var(--line);min-height:56px}
.appbar .ttl{flex:1;min-width:0;padding-left:4px}
.appbar .ttl h2{font-size:18px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.appbar .ttl small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--blue-soft)}
.iconbtn:disabled{opacity:.35;cursor:default;background:transparent}
.iconbtn.sm{width:36px;height:36px;border-radius:8px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 100px;position:relative}
.screen.nonav{padding-bottom:32px}
.nav{position:absolute;left:0;right:0;bottom:0;height:68px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:4px;z-index:4}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.nav button.on{color:var(--blue);font-weight:600}
.nav svg{width:22px;height:22px}
.nbadge{position:absolute;top:7px;left:50%;margin-left:5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.fab{position:absolute;right:18px;bottom:84px;width:58px;height:58px;border-radius:18px;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(214,48,59,.6);z-index:5}
.fab svg{width:26px;height:26px}

/* common */
.banner{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500;margin-bottom:14px;line-height:1.45}
.banner b{flex:none;font-size:16px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;min-height:46px}
.btn.primary{background:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1430}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1430}}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.sec-head span{font-size:13px;font-weight:600;color:var(--muted)}
.link{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:600;padding:4px 0}
.link.danger{color:var(--red)}
.center{display:block;margin:10px auto 0}
.hint{font-size:13px;color:var(--muted);margin:10px 0 14px}
.help{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.explain{font-size:12px;color:var(--muted);margin:4px 0 0}
.empty{font-size:14px;color:var(--muted);margin:0}
.optional{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
.count{font-size:12px;color:var(--muted);margin:2px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card-head h3{margin:0}
.empty-card{text-align:center;background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;margin-bottom:12px}
.empty-card .pen{display:block;font-size:30px;color:var(--blue);line-height:1.1;margin-bottom:6px}
.empty-card p{color:var(--muted);font-size:14px;margin:0 0 14px}
.err{background:var(--red-soft);border-radius:12px;padding:14px;margin:12px 0}
.err b{color:var(--red)}
.err p{margin:4px 0 12px;font-size:14px;word-break:break-word}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{flex:1;padding:10px;font-size:14px;min-height:42px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite;margin:0 auto 14px}
.loading{text-align:center;padding:40px 12px;color:var(--ink)}
.pbar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
@keyframes spin{to{transform:rotate(360deg)}}

/* form */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.input{width:100%;min-height:44px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
textarea.input{resize:vertical;line-height:1.5}
select.input{padding-right:8px}
.input:focus{outline:none;border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px}
.row3 .field,.row2 .field{margin-bottom:0}
.seg{display:flex;background:var(--grid);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--muted);min-height:38px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.keyrow{display:flex;gap:6px;align-items:center}
.keyrow .input{flex:1;min-width:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.sbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.sbtn:hover{border-color:var(--blue)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.card .chips:last-child{margin-bottom:0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;flex:none;min-height:36px;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--blue)}
.chip .x{border:0;background:transparent;color:var(--muted);margin:0 -6px 0 4px;padding:0 4px;font-size:16px;line-height:1}
.banner{padding:0;gap:0}
.banner .bmain{flex:1;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:inherit;text-align:left;padding:10px 12px;font:inherit;font-size:13px;font-weight:500;line-height:1.45}
.banner .bmain b{flex:none;font-size:16px}
.banner .iconbtn{color:var(--blue);margin-right:4px}
.notice{background:var(--surface);border:1.5px solid var(--blue);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.notice b{display:block;font-size:15px}
.notice small{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
.notice .acts{display:flex}
.notice.warnn{border-color:var(--red);background:var(--red-soft)}
.quiet-add{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:14px;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:12px 14px;color:var(--blue);font-weight:600;font-size:14px}
.qa-plus{font-size:22px;line-height:1;width:22px;text-align:center}
.quiet-add small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.45}
.cover-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cover-tg{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;min-height:38px;color:var(--muted)}
.cover-tg.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.covered{margin-top:14px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
.covered p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.seg button small{font-size:11px;opacity:.7}
.note-foot{margin-top:14px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);text-align:right}
.report h3,.report-cta h3{display:flex;align-items:center;gap:6px}
.rp-head{font-size:16px;font-weight:700;margin:0 0 10px;line-height:1.5}
.rp{padding:8px 0;border-top:1px dashed var(--line)}
.rp b{font-size:13px}
.rp.g b{color:var(--ok)} .rp.w b{color:var(--red)} .rp.p b{color:var(--blue)}
.rp ul{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.65}
.cf-photo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:12px;text-align:center}
.cf-photo img{display:block;width:100%;max-height:220px;object-fit:contain;cursor:zoom-in;border-radius:8px}
.cf-photo img.zoom{max-height:none;cursor:zoom-out}
.cf-photo small{display:block;font-size:11px;color:#6b7385;margin-top:4px}
mark.unsure{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px;box-shadow:0 0 0 1.5px #d9b100 inset}
.cf-read .qtext{font-size:16px}
.cf-ch{margin-bottom:6px}
.cf-ch .n{width:22px;text-align:center;color:var(--muted);flex:none}
.kbd{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.kb{min-width:44px;min-height:40px;padding:0 10px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:14px;font-weight:600}
.kb:active{background:var(--blue-soft)}
.cf-live{border:1px dashed var(--line);border-radius:10px;padding:8px 12px 12px;margin-top:10px}
.cf-live>small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.cf-opt{align-items:flex-start;margin:4px 2px 14px}
.cf-opt input{margin-top:3px;flex:none}
.cf-opt small{display:block;font-size:12px;color:var(--muted)}
.tier-box{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;padding:0 12px}
.tier-tg{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:12px 0;min-height:52px}
.tier-tg>span:first-child{flex:1}
.tier-tg b{display:block;font-size:14px}
.tier-tg small{display:block;font-size:12px;color:var(--muted)}
.tier-tg .chev{transition:transform .15s}
.tier-tg .chev.up{transform:rotate(90deg)}
.or-sync{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.or-sync b{color:var(--ink)}
.or-sync .sub{display:block;margin-top:2px;line-height:1.5}
.tm .tm-info.warn{color:#B26A00}
.or-sync .muted{color:var(--muted)}
.or-sync .bad{color:var(--red)}
.or-sync>div{min-width:0}
.or-sync .sbtn{min-height:34px;flex:none}
.tm-row{display:grid;grid-template-columns:112px 1fr;gap:6px}
.tm-row .input{min-width:0}
.tm .tm-now{color:var(--ink)}
.tm .tm-info.muted{color:var(--muted)}
.keyf .input{margin-bottom:0}
.tm small{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.tm .tm-info{color:var(--ok)}
.tm .tm-info.bad{color:var(--red)}
.tier-use{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:10px}
.tier-use>div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tier-use span{display:block;font-size:11px;color:var(--muted)}
.tier-use b{display:block;font-size:14px}
.tier-use small{font-size:11px;color:var(--muted)}
.help-hello{display:flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--blue);border-radius:12px;padding:4px 6px 4px 4px;margin-bottom:14px}
.hh-main{flex:1;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px;color:var(--blue)}
.hh-main span{color:var(--ink)}
.hh-main b{display:block;font-size:15px}
.hh-main small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.help-list{list-style:none;margin:0;padding:0}
.help-list li{padding:10px 2px;border-top:1px dashed var(--line)}
.help-list li:first-child{border-top:0;padding-top:2px}
.help-list li b{font-size:14px}
.help-list li p{margin:2px 0 0;font-size:14px;color:var(--ink);line-height:1.65}
.help-list li p b{font-size:inherit;color:var(--blue)}
.tagin{display:flex;gap:6px;flex:1 1 100%;margin-top:4px}
.tagin .input{flex:1;min-width:0;min-height:40px;padding:6px 12px;font-size:14px;background:var(--surface)}

/* home */
.today{background:var(--surface);border:1.5px solid var(--ink);border-radius:6px 18px 6px 18px;padding:18px;margin-bottom:6px;position:relative}
.today .big{font-size:42px;line-height:1;color:var(--red)}
.today p{margin:6px 0 14px;color:var(--muted);font-size:14px}
.today p:last-child{margin-bottom:0}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.course-card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--blue));border-radius:12px;padding:14px 12px 12px;min-height:122px;display:flex;flex-direction:column;gap:1px}
.course-card .ini{width:38px;height:38px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:26px;line-height:1;margin-bottom:8px}
.course-card b{font-size:16px;line-height:1.3;word-break:keep-all}
.course-card .meta{font-size:12px;color:var(--muted)}
.course-card .due{position:absolute;top:12px;right:10px;font-size:11px;font-weight:600;color:var(--red);background:var(--red-soft);border-radius:6px;padding:1px 7px}
.course-card.add{border:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--muted);font-weight:600;gap:4px}
.pick-head{margin:6px 2px 14px}
.pick-head .pen{font-size:28px;line-height:1.2;color:var(--ink)}
.pick-head p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.today-strip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;background:var(--blue-soft,var(--surface));border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.today-strip>span:first-child{flex:1;min-width:0}
.today-strip b{display:block;font-size:15px}
.today-strip small{font-size:12px;color:var(--muted)}
.today-strip .go{font-weight:700;color:var(--blue);white-space:nowrap}
.pick-head .streak{color:var(--red);font-weight:700}
.exam-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-height:64px}
.exam-card .dd{flex:none;min-width:64px;text-align:center;font-size:26px;line-height:1;color:var(--c)}
.exam-card .t{flex:1;min-width:0;display:flex;flex-direction:column}
.exam-card .t b{font-size:15px}
.exam-card .t small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exam-empty{width:100%;text-align:left;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:14px;font-size:13px;color:var(--muted);line-height:1.5}
.dday-hero{text-align:center;padding:8px 0 16px}
.dday-hero .pen{display:block;font-size:56px;line-height:1.05;color:var(--c)}
.dday-hero p{margin:6px auto 0;max-width:330px;font-size:13px;color:var(--muted);line-height:1.5}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:transparent;padding:10px 0;min-height:48px}
.lrow:first-child{border-top:0;padding-top:0}
.lrow>span:first-child{flex:1;min-width:0}
.lrow b{display:block;font-size:14px}
.lrow small{font-size:12px;color:var(--muted)}
.lrow .n{font-size:22px;color:var(--red);min-width:22px;text-align:right}
.scope-sub{padding:8px 0;border-top:1px dashed var(--line)}
.scope-sub:first-of-type{border-top:0}
.cropbox.m{box-shadow:none;background:rgba(39,71,201,.10)}
.cropbox.m.off{border-style:dashed;border-color:#8a93a8;background:rgba(120,130,150,.08)}
.cropbox.m.off .lab{background:#8a93a8}
.reg-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.reg-row .check{flex:none}
.reg-row .input{flex:1;min-width:0;min-height:40px;padding:6px 10px}
.sug{border-color:var(--blue)}
.mistake .adv{margin:6px 0 0;font-size:13px}
.mistake .adv b{color:var(--red)}
.row .when.grad{color:var(--ok);font-weight:700;font-size:12px}
.srs.grad b{color:var(--ok)}
.wchart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px}
.wc{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.wc .stack{flex:1;width:100%;max-width:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;background:var(--grid);border-radius:4px 4px 0 0;overflow:hidden}
.wc .stack i{display:block;width:100%}
.wc span{font-size:10px;color:var(--muted);height:12px;line-height:12px;white-space:nowrap}
.wc span.wtoday{color:var(--ink);font-weight:700}
.lrow .n.zero{color:var(--muted)}
i.o{background:var(--ok)} i.b{background:var(--red)}
.wlegend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.wlegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.usage{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.usage>div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}
.usage span{font-size:12px;color:var(--muted);display:block}
.usage b{font-size:18px;display:block;line-height:1.3}
.usage b small{font-size:11px;font-weight:500;color:var(--muted)}
.usage>div>small{font-size:11px;color:var(--muted);display:block;line-height:1.4}
.pbar.warnbar i{background:#C27803}
.pbar.over i{background:var(--red)}
.chip .cc{font-size:11px;opacity:.65;margin-left:4px}
.cv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px;font-size:14px}
.cv-head .link{display:inline-flex;align-items:center;gap:4px}
.cv-unit h3{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 8px}
.cv-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.cv-item.open{border-color:var(--blue)}
.cv-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;min-height:58px}
.cv-row .t{flex:1;min-width:0}
.cv-row .t b{display:block;font-size:15px}
.cv-row .t small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-item.none .t b{color:var(--muted)}
.cv-row .cnt{font-size:12px;color:var(--muted);flex:none}
.cv-row .chev{transition:transform .15s}
.cv-row .chev.up{transform:rotate(90deg)}
.cv-body{padding:0 12px 12px}
.cv-body .note{margin-bottom:10px}
.cv-acts{display:flex;flex-wrap:wrap;gap:6px}
.cv-print-h{font-size:15px;margin:18px 0 8px}
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subj{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;min-height:64px}
.subj b{font-size:15px;line-height:1.3;word-break:keep-all}
.subj>span{font-size:12px;color:var(--muted)}
.subj .flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.subj .flags i{font-style:normal;font-size:11px;font-weight:600;border-radius:5px;padding:0 6px}
.subj .fd{color:var(--blue);background:var(--blue-soft)}
.subj .fw{color:var(--red);background:var(--red-soft)}
.course-card.add .plus{font-size:30px;line-height:1;color:var(--blue)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;outline:0}
.sw.on{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--ink)}

.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-height:62px}
.item .band{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px}
.item .t span{font-size:12px;color:var(--muted)}
.chev{color:var(--muted);font-size:22px;line-height:1}
.opt-card{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.opt-card b{display:block;font-size:16px;margin-bottom:2px}
.opt-card span{font-size:13px;color:var(--muted)}
.opt-card.rec{border-color:var(--blue)}
.opt-card .badge{margin:0 0 6px}

/* list rows */
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 4px;text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
.row:first-of-type{border-top:1px solid var(--line)}
.row .tag{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--red);color:var(--red);display:grid;place-items:center;font-size:19px;line-height:1;transform:rotate(-8deg)}
.row .tag.long{font-size:14px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t em{display:block;font-style:normal;font-size:11px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:11px;color:var(--muted);flex:none;text-align:right;line-height:1.35}
.search{position:relative;margin-bottom:10px}
.search .input{padding-left:38px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin-bottom:12px}
.frow .input{min-height:38px;padding:6px 8px;font-size:13px;background:var(--surface)}

/* add */
.pslot{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.pslot:first-of-type{border-top:0;padding-top:0}
.pslot:last-child{padding-bottom:0}
.pslot .ph{width:58px;height:58px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);flex:none;overflow:hidden;background:var(--paper)}
.pslot .ph img{width:100%;height:100%;object-fit:cover}
.pslot.filled .ph{border-style:solid;border-color:var(--blue)}
.pslot .t{flex:1;min-width:0}
.pslot .t b{display:block;font-size:14px}
.pslot .t>span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.pslot .acts{flex:none;gap:4px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.th{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.photo{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-top:10px}
.cropwrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.cropwrap img{display:block;width:100%;pointer-events:none}
.cropbox{position:absolute;border:2px solid var(--blue);box-shadow:0 0 0 9999px rgba(10,15,30,.45);cursor:move;touch-action:none}
.cropbox .h{position:absolute;right:-11px;bottom:-11px;width:22px;height:22px;border-radius:50%;background:var(--blue);border:2px solid #fff;cursor:nwse-resize}
.cropbox .lab{position:absolute;left:-2px;top:-24px;background:var(--blue);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px 6px 0 0;white-space:nowrap}
.steps{list-style:none;padding:0;margin:20px 0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;color:var(--muted);transition:color .3s}
.steps li .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.steps li.doing,.steps li.done{color:var(--ink)}
.steps li.doing .dot{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.steps li small{display:block;font-size:12px;color:var(--muted)}
.warn{background:var(--hl);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* note */
.note{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 16px;position:relative;margin-bottom:14px}
.note-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.note-top .src{font-size:12px;color:var(--muted);text-align:right;padding-top:6px;line-height:1.35}
.stamp{display:inline-block;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 10px;font-size:24px;line-height:1.3;transform:rotate(-3deg);margin-bottom:8px;max-width:70%}
.type-line{font-weight:700;font-size:17px;margin:2px 0 6px;line-height:1.4}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;vertical-align:2px;margin-left:4px;line-height:1.5}
.badge.new{background:var(--red-soft);color:var(--red)}
.badge.match{background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.utags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.utags span{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--red);color:var(--red)}
.concepts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.concepts span{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.qtext{margin:0 0 10px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.qtext .num{font-weight:700;margin-right:4px}
.fig{display:flex;justify-content:center;margin:6px 0 12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.fig img{max-width:100%;max-height:260px;display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px 10px;font-size:14px;margin-bottom:6px}
.choices.long{grid-template-columns:1fr}
.choices span{position:relative;padding:2px 0}
.choices .ans::before{content:"";position:absolute;left:-6px;top:-3px;width:34px;height:30px;border:2px solid var(--red);border-radius:50%;transform:rotate(-10deg)}
.choices .mine{text-decoration:line-through;text-decoration-color:var(--muted)}
.ansline{font-size:14px;margin:0 0 6px}
.ansline b{color:var(--red);margin-right:4px}
.legend{font-size:12px;color:var(--muted);margin-bottom:6px}
.mistake{background:var(--red-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.mistake .pen{display:block;color:var(--red);font-size:21px;line-height:1.1}
.divider{border:0;border-top:1px dashed var(--line);margin:14px 0}
.sol h4{margin:0 0 8px;font-size:14px}
.sol ol{margin:0;padding-left:0;list-style:none;counter-reset:st}
.sol li{margin-bottom:6px;position:relative;padding-left:22px;counter-increment:st}
.sol li::before{content:counter(st) ".";position:absolute;left:0;top:0;font-weight:700;color:var(--muted)}
.sol p{margin:0 0 8px}
.key{margin-top:12px;font-weight:600;line-height:1.7}
.key mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 2px}
.key .pen{color:var(--red);font-size:22px;font-weight:400;margin-right:4px}
.toggle{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:600;padding:6px 0}
.srs{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srs b{display:block;font-size:15px}
.srs span{font-size:12px;color:var(--muted)}

/* concept */
.concept .summary{font-size:15px;margin:0 0 6px}
.cpt{padding:10px 0;border-top:1px dashed var(--line)}
.cpt h4{margin:0 0 4px;font-size:15px;color:var(--blue)}
.cpt p{margin:0;font-size:14px}
.formulas{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-direction:column;gap:6px}
.formulas li{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;font-size:14px}
.clist{margin:0;padding-left:20px;font-size:14px}
.clist li{margin-bottom:4px}

/* review */
.progress{display:flex;gap:4px;margin-bottom:14px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--blue)}
.from{font-size:12px;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 44px 12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;position:relative;min-height:50px}
.opt .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.mark{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:34px;line-height:1}
.verdict{border-radius:12px;padding:14px;margin-bottom:12px}
.verdict.good{background:var(--ok-soft)}
.verdict.bad{background:var(--red-soft)}
.verdict.unsure{background:var(--blue-soft)}
.verdict.unsure .pen{color:var(--blue)!important}
.btn.dunno{margin-top:4px;color:var(--muted)}
.verdict .pen{font-size:30px;line-height:1}
.verdict p{margin:4px 0 0;font-size:14px}
.done-card{text-align:center;padding:40px 10px}
.done-card .pen{font-size:52px;color:var(--red);line-height:1.1;display:block;margin-bottom:10px}
.done-card p{color:var(--muted);margin:0 0 20px}

/* stats & map */
.bars{display:flex;flex-direction:column;gap:12px;margin:4px 0}
.bar .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.bar .lbl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:3px}
.bar.top .fill{background:var(--red)}
.bar.click{cursor:pointer;border-radius:6px}
.bar.click:hover .lbl span{color:var(--blue)}
.callout{background:var(--surface);border-left:4px solid var(--red);padding:12px 14px;margin:16px 0;font-size:14px}
.callout .pen{font-size:24px;color:var(--red);display:block;line-height:1.2}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.kv3 div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.kv3 b{font-size:20px;display:block;line-height:1.2}
.kv3 span{font-size:11px;color:var(--muted)}
.subject{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 12px 6px;margin-top:14px}
.unit{margin-bottom:12px}
.unit .ul{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.unit .ul b{color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tile{border:1px solid var(--line);border-radius:6px;padding:6px 6px 4px;min-height:64px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--h0)}
.tile small{font-size:10.5px;line-height:1.3;word-break:keep-all}
.tile .cr{display:flex;align-items:center;justify-content:space-between}
.tile .c{font-size:20px;line-height:1;margin-left:auto}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block}
.tile.l1{background:var(--h1);border-color:transparent}
.tile.l2{background:var(--h2);border-color:transparent}
.tile.l3{background:var(--h3);border-color:transparent;color:var(--h3t)}
.tile.l3 .cdot{background:var(--h3t)}
.tile.l0 .c{color:var(--muted);opacity:.5}
.legend2{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:10px 0 0;justify-content:flex-end;flex-wrap:wrap}
.legend2 i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.trow{padding:10px 0;border-top:1px dashed var(--line)}
.card .trow:first-child{border-top:0;padding-top:0}
.trow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.trow .top .pen{color:var(--red);font-size:22px;font-weight:400;line-height:1}
.trow .track{height:8px;border-radius:2px;background:var(--grid);margin:6px 0}
.trow .fill{height:100%;border-radius:2px;background:var(--red)}

/* toc editor */
.tree-unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.tree-row{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.tree-row .input{min-height:40px;padding:8px 10px}
.tree-row:not(.sub) .input{font-weight:600}
.tree-row.sub{padding-left:16px}
.tree-row .tn{width:22px;text-align:center;color:var(--muted);flex:none;font-size:14px;font-weight:700}

/* settings */
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0;padding-top:0}
.srow:last-child{padding-bottom:0}
.srow label,.srow .sl{font-size:14px;font-weight:500}
.srow small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.srow .input{width:auto;min-width:120px;max-width:160px;min-height:38px;padding:6px 8px;font-size:14px}
.srow .seg{min-width:170px}
.seg.prov button{padding:8px 2px;font-size:12.5px}
.test{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:8px}
.test.ok{background:var(--ok-soft);color:var(--ok)}
.test.bad{background:var(--red-soft);color:var(--red)}

/* sheet & toast */
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,30,.45);z-index:20;display:flex;align-items:flex-end}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--paper);width:100%;border-radius:20px 20px 0 0;padding:20px 16px 24px;max-height:85%;overflow-y:auto;animation:up .2s ease-out}
.sheet h3{margin:0 0 14px;font-size:18px}
.sheet-actions{display:flex;gap:8px;margin-top:18px}
.sheet-actions .btn{flex:1}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:14px 4px;border-top:1px solid var(--line);font-size:15px;min-height:52px}
.menu button:first-child{border-top:0}
.menu button small{display:block;font-size:12px;color:var(--muted)}
.menu button.danger{color:var(--red)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:30}

'use strict';

// helpers
// =====================================================================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _uc = 0;
const uid = (p='') => p + Date.now().toString(36) + (_uc++).toString(36) + Math.random().toString(36).slice(2,6);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const arr = v => Array.isArray(v) ? v : [];
const lines = v => String(v||'').split('\n').map(s=>s.trim()).filter(Boolean);
const clone = o => JSON.parse(JSON.stringify(o));
const intOrNull = v => Number.isInteger(v) ? v : (typeof v==='string' && /^\d+$/.test(v) ? +v : null);
const NUM = ['①','②','③','④','⑤','⑥','⑦'];
const COLORS = ['#2747C9','#D6303B','#1E8C55','#C27803','#7B3FC4','#0E7C86','#5F6B85'];

function ymd(d=new Date()){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); }
function dayDiff(s){ const [y,m,d]=s.split('-').map(Number); const a=new Date(y,m-1,d), t=new Date(); t.setHours(0,0,0,0); return Math.round((a-t)/864e5); }
function dueLabel(s){ const k=dayDiff(s); return k<=0?'오늘':k===1?'내일':k+'일 뒤'; }
function agoLabel(ts){ const k=-dayDiff(ymd(new Date(ts))); return k<=0?'오늘':k===1?'어제':k+'일 전'; }

const IC = {

  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',

  eyeOff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3 3.8M6.6 6.6A17 17 0 002 12s3.5 7 10 7a9.7 9.7 0 005.4-1.6"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>',

// =====================================================================
// storage: localStorage (data) + IndexedDB (images)
// =====================================================================
const LS_KEY = 'odap.v2';
let DB;
const INTERVALS = {
  tight:{ label:'촘촘하게 (1·2·4·7·14일)', d:[1,2,4,7,14] },
  normal:{ label:'기본 (1·3·7·14·30일)', d:[1,3,7,14,30] },
  loose:{ label:'느슨하게 (2·5·10·20·40일)', d:[2,5,10,20,40] }
};
const GRADES = ['중1','중2','중3','고1','고2','고3','N수생'];
function defaultSettings(){ return {
  provider:'openai', keys:{openai:'',claude:'',gemini:'',openrouter:''}, models:{openai:'',claude:'',gemini:'',openrouter:''},
  grade:'고1', reviewPerDay:10, intervals:'normal', conceptThreshold:3, makeSimilar:true,
  theme:'system', fontScale:1, gradCount:3, budget:0, prices:{}, krw:1400,
  advanced:false, simLevel:'same', confirmRead:'always', cover:false, lastBackup:'', backupSnooze:'', bannerHidden:false, helpSeen:false,
  tagPresets:['계산 실수','개념 부족','문제 해석 실수','조건 놓침','시간 부족','찍음'],
  workbooks:['기본 유형서','모의고사 기출']
}; }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ toast('저장 공간이 부족해요. 설정에서 백업한 뒤 정리해주세요'); } }
function migrate(){
  const d=defaultSettings(), s=DB.settings||{};
  DB.settings={...d, ...s, keys:{...d.keys, ...(s.keys||{})}, models:{...d.models, ...(s.models||{})}};
  DB.settings.prices=DB.settings.prices||{};
  if(!DB.settings.tiers || typeof DB.settings.tiers!=='object'){ // 예전 형식(회사별 작업 모델)을 옮긴다
    const old=(DB.settings.tm||{})[DB.settings.provider]||{}; DB.settings.tiers={};
    ['read','solve','verify','write'].forEach(k=>{ DB.settings.tiers[k]={p:'', m:String(old[k]||'').trim()}; });
  }
  delete DB.settings.tm;
  DB.courses=arr(DB.courses); DB.subjects=arr(DB.subjects); DB.notes=arr(DB.notes); DB.exams=arr(DB.exams); DB.usage=DB.usage||{};
  DB.courses.forEach(c=>{ if(!KINDS[c.kind]) c.kind=guessKind(c.name); c.aiNote=c.aiNote||''; });
  DB.stats=DB.stats||{}; DB.stats.reviews=arr(DB.stats.reviews); DB.stats.quizzes=arr(DB.stats.quizzes);
  DB.subjects.forEach(s=>{ s.units=arr(s.units); s.units.forEach(u=>u.subs=arr(u.subs)); s.concepts=s.concepts||{}; });
  DB.notes.forEach(n=>{ n.tags=arr(n.tags); n.choices=arr(n.choices); n.steps=arr(n.steps); n.concepts=arr(n.concepts); n.similar=arr(n.similar); n.history=arr(n.history); n.imgs=n.imgs||{}; n.srs=n.srs||{step:0,due:ymd()}; n.srs.streak=n.srs.streak||0; n.graduated=n.graduated||null; });
}
// 교과 종류별로 AI에게 주는 지시
const KINDS = {
  math:{ label:'수학형', desc:'수식 풀이와 계산이 중심', guide:`이 교과는 수학이다. 문제와 풀이의 모든 수식은 LaTeX로 쓴다. 풀이는 식 변형이 끊기지 않게 단계별로 쓰고, 계산 결과를 한 번 더 검산한다.` },
  science:{ label:'과학형', desc:'그래프, 실험, 자료 해석이 중심', guide:`이 교과는 과학이다. 그래프, 표, 실험 장치 그림이 있으면 축 이름, 단위, 수치, 실험 조건을 먼저 읽고 문제 글 끝에 '자료:'로 시작하는 줄로 정리해 옮긴다. 보기(ㄱ, ㄴ, ㄷ)가 있으면 문제 글에 줄바꿈으로 함께 적는다. 풀이는 어떤 원리나 법칙을 근거로 판단했는지 밝히고, 단위와 부호를 확인한다. 물리량과 식은 LaTeX로 쓴다. 유사문제에 그림이 필요하면 자료를 표나 글로 바꿔 제시한다.` },
  general:{ label:'일반형', desc:'개념 이해, 암기, 서술이 중심', guide:`이 교과는 개념 이해와 암기가 중심이다. 풀이는 정답의 근거가 되는 개념과, 학생이 고른 오답이 왜 틀렸는지를 짧게 정리한다. 수식이 없는 문제에는 LaTeX를 쓰지 않는다.` }
};
const guessKind = n => /수학|산수|미적|기하|확률|대수/.test(n||'') ? 'math' : /과학|물리|화학|생명|생물|지구|천문/.test(n||'') ? 'science' : 'general';
function load(){
  try{ const s=localStorage.getItem(LS_KEY); if(s){ DB=JSON.parse(s); migrate(); return; } }catch(e){}
  DB=seed(); save();
}

const IDB = (()=>{
  let p;
  const open=()=>p||(p=new Promise((res,rej)=>{ const r=indexedDB.open('odap-images',1); r.onupgradeneeded=()=>r.result.createObjectStore('img'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  // 저장소가 응답하지 않는 환경(일부 사생활 보호 모드 등)에서 화면이 멈추지 않게 시간 제한을 둔다
  const limit=(pr,ms=5000)=>Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error('사진 저장소가 응답하지 않아요')),ms))]);
  const tx=(mode,fn)=>limit(open()).then(db=>new Promise((res,rej)=>{ const t=db.transaction('img',mode); const req=fn(t.objectStore('img')); t.oncomplete=()=>res(req&&req.result); t.onerror=()=>rej(t.error); }));
  return {
    put:(k,v)=>tx('readwrite',s=>s.put(v,k)),
    get:k=>tx('readonly',s=>s.get(k)),
    del:k=>tx('readwrite',s=>s.delete(k)),
    clear:()=>tx('readwrite',s=>s.clear()),
    all:()=>open().then(db=>new Promise((res,rej)=>{ const out={}; const t=db.transaction('img'); const c=t.objectStore('img').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }))
  };
})();
const IMG = new Map();
async function imgSrc(id){ if(!id) return null; if(IMG.has(id)) return IMG.get(id); const v=await IDB.get(id).catch(()=>null); if(v) IMG.set(id,v); return v; }
let IMG_OK=null;
async function probeImages(){ try{ await IDB.put('__probe','1'); IMG_OK=true; }catch(e){ IMG_OK=false; } if(route.name==='home') render(); }
function hydrate(root){ root.querySelectorAll('img[data-img]').forEach(async el=>{ const v=await imgSrc(el.dataset.img); if(v) el.src=v; else { const s=document.createElement('span'); s.className='explain'; s.textContent='사진을 찾을 수 없어요'; el.replaceWith(s); } }); }
function dropImages(n){ Object.values(n.imgs||{}).forEach(id=>{ IDB.del(id).catch(()=>{}); IMG.delete(id); }); }

function readImage(file, max=1600){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.85)); };
      im.onerror=()=>rej(new Error('이 사진 형식은 열 수 없어요. JPG나 PNG로 바꿔주세요'));
      im.src=fr.result; };
    fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file);
  });
}
function rotateImage(src){
  return new Promise((res,rej)=>{ const im=new Image();
    im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.height; c.height=im.width;
      const g=c.getContext('2d'); g.translate(c.width,0); g.rotate(Math.PI/2); g.drawImage(im,0,0); res(c.toDataURL('image/jpeg',0.9)); };

function aiErr(status, j){
  const m = (j && j.error && (j.error.message || j.error.status)) || '';
  if(status===401 || status===403 || /api key/i.test(m)) return 'API 키가 올바르지 않아요. 설정에서 키를 확인해주세요.';
  if(status===402) return '크레딧이 부족해요. 충전 상태를 확인해주세요.';
  if(/image/i.test(m) && /support|endpoint/i.test(m)) return '이 모델은 사진을 읽지 못해요. 설정에서 사진 입력을 지원하는 모델로 바꿔주세요.';

  if(status===404 || /model/i.test(m) && /not|exist|found/i.test(m)) return '모델 이름을 찾을 수 없어요. 설정에서 모델명을 확인해주세요. ('+m+')';
  if(status>=500) return 'AI 서버에 문제가 있어요. 잠시 뒤 다시 시도해주세요.';
  return `요청이 거절됐어요 (${status}). ${m}`;
}
function parseJSON(t){
  t=String(t).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0 || b<a) throw new Error('no json');
  t=t.slice(a,b+1);
  try{ return JSON.parse(t); }catch(e){ return JSON.parse(t.replace(/\\(?!["\\/bfnrtu])/g,'\\\\')); }
}
// JSON 이스케이프를 빠뜨린 LaTeX(\frac → 폼피드 등)를 되살린다
function fixLatex(o){
  if(typeof o==='string') return o.replace(/\f/g,'\\f').replace(/\x08/g,'\\b').replace(/\t(?=[a-zA-Z])/g,'\\t').replace(/\r(?=[a-zA-Z])/g,'\\r')
    .replace(/\n(?=(?:eq|abla|ot|u|i|leq|geq|mid|exists|ewline|e)(?![a-zA-Z]))/g,'\\n');
  if(Array.isArray(o)) return o.map(fixLatex);
  if(o && typeof o==='object'){ for(const k in o) o[k]=fixLatex(o[k]); }
  return o;
}

function trackUsage(model, tier, u){

  if(typeof u.cost==='number' && isFinite(u.cost)) c=u.cost;
  else if(pr) c=(u.i*pr[0]+u.o*pr[1])/1e6; else r.unk++;
  r.cost+=c;
  if(tier){ r.t=r.t||{}; const x=r.t[tier]||(r.t[tier]={c:0,cost:0}); x.c++; x.cost+=c; }
  save();
}

}

할 일:

const SIM_LV={ easy:'원래 문제보다 한 단계 쉽게. 조건을 하나 줄이거나 숫자를 단순하게 해서 핵심 개념만 확인한다.',
  same:'원래 문제와 같은 난이도.', hard:'원래 문제보다 한 단계 어렵게. 조건을 하나 더하거나 개념을 한 번 더 연결한다. 그래도 고등학교 범위 안에서 풀 수 있어야 한다.' };
const SIM_LABEL={easy:'쉽게',same:'비슷하게',hard:'어렵게'};
async function makeVerifiedSimilar(src, subjectName, onVerify, courseId, level){
  level=level||DB.settings.simLevel||'same';
  for(let t=0;t<2;t++){
    const r = await AI.task('makeSimilar',{src, subjectName, courseId, level});
    const p = { text:String(r.text||''), choices:arr(r.choices).map(String), answer:String(r.answer??''), answer_index:intOrNull(r.answer_index), solution:String(r.solution||'') };
    if(!p.text) continue;
    onVerify && onVerify();
    const v = await AI.task('verify',{p, courseId});
    if(sameAnswer(p, v)) return [{...p, verified:true, level}];
  }
  return [];
}
function sameAnswer(p, v){
  const norm = s => String(s??'').replace(/\\\(|\\\)|\$|\s|\\,|\\!/g,'').toLowerCase();
  if(p.choices.length && p.answer_index!==null && intOrNull(v.answer_index)!==null) return p.answer_index===intOrNull(v.answer_index);
  return norm(p.answer)!=='' && norm(p.answer)===norm(v.answer);
}

const courseById = id => DB.courses.find(c=>c.id===id);
const subjectById = id => DB.subjects.find(s=>s.id===id);
const noteById = id => DB.notes.find(n=>n.id===id);
const subjectsOf = cid => DB.subjects.filter(s=>s.courseId===cid);
function leaves(s){
  const out=[]; if(!s) return out;
  s.units.forEach(u=>{ if(u.subs.length) u.subs.forEach(sb=>out.push({id:sb.id,name:sb.name,unitId:u.id,unitName:u.name,isUnit:false}));
    else out.push({id:u.id,name:u.name,unitId:u.id,unitName:u.name,isUnit:true}); });
  return out;
}
const leafOf = (s,lid) => s && lid ? leaves(s).find(l=>l.id===lid) : null;
const leafName = n => { const l=leafOf(subjectById(n.subjectId), n.leafId); return l ? l.name : '단원 미지정'; };
const notePath = n => { const s=subjectById(n.subjectId), c=s&&courseById(s.courseId); return [c&&c.name, s&&s.name, leafName(n)].filter(Boolean).join(' › '); };
const metaLine = n => [n.workbook, n.page?`p.${n.page}`:'', n.number?`${n.number}번`:''].filter(Boolean).join(' ');
const leafNotes = (sid,lid) => DB.notes.filter(n=>n.subjectId===sid && n.leafId===lid);
const isDue = n => !n.graduated && n.srs.due <= ymd();
const leafActive = (sid,lid) => leafNotes(sid,lid).filter(n=>!n.graduated);
function weakLeaves(){
  const th=DB.settings.conceptThreshold, out=[];
  DB.subjects.forEach(s=>leaves(s).forEach(l=>{ const n=leafActive(s.id,l.id).length; if(n>=th) out.push({sid:s.id,lid:l.id,n,name:l.name,path:`${s.name} › ${l.name}`}); }));
  return out.sort((a,b)=>b.n-a.n);
}
function reviewQueue(){
  const t=ymd();
  const due=DB.notes.filter(isDue).sort((a,b)=>a.srs.due.localeCompare(b.srs.due)).slice(0,DB.settings.reviewPerDay).map(n=>({kind:'note',noteId:n.id}));
  const done=new Set(DB.stats.quizzes.filter(q=>q.d===t).map(q=>q.lid));
  const cq=weakLeaves().filter(w=>!done.has(w.lid)).slice(0,2).map(w=>({kind:'concept',sid:w.sid,lid:w.lid}));
  return [...due, ...cq];
}
function applySrs(n, ok){
  const d=(INTERVALS[DB.settings.intervals]||INTERVALS.normal).d;
  n.srs.streak = ok ? (n.srs.streak||0)+1 : 0;
  if(ok){ n.srs.step=Math.min((n.srs.step||0)+1, d.length-1); n.srs.due=addDays(d[n.srs.step]); }
  else { n.srs.step=0; n.srs.due=addDays(1); }
  if(ok && n.srs.streak>=DB.settings.gradCount && !n.graduated){ n.graduated=ymd(); return true; }
  return false;
}
function graduate(id, on){
  const n=noteById(id); if(!n) return;
  if(on){ n.graduated=ymd(); toast('졸업시켰어요. 이제 복습에 나오지 않아요'); }
  else { n.graduated=null; n.srs.streak=0; n.srs.step=0; n.srs.due=addDays(1); toast('다시 복습에 넣었어요. 내일 나와요'); }
  save(); render();
}

// ---- 꾸준함
function activeDays(){
  return new Set([...DB.stats.reviews.map(r=>r.d), ...DB.stats.quizzes.map(q=>q.d), ...DB.notes.filter(n=>!n.sample).map(n=>ymd(new Date(n.createdAt)))]);
}
function backupDue(){
  const S=DB.settings, real=DB.notes.filter(n=>!n.sample); if(real.length<3) return null;
  if(S.backupSnooze && S.backupSnooze>ymd()) return null;
  const base=S.lastBackup || ymd(new Date(Math.min(...real.map(n=>n.createdAt))));
  const days=Math.round((new Date(ymd())-new Date(base))/864e5);
  return days>=14 ? {days, never:!S.lastBackup} : null;
}
function streakDays(){ const s=activeDays(); let d=s.has(ymd())?0:-1, k=0; while(s.has(addDays(d))){ k++; d--; } return k; }

// ---- 시험 대비
const examById = id => DB.exams.find(e=>e.id===id);
function inScope(e,n){ const sc=e.scope.find(x=>x.sid===n.subjectId); return !!sc && (!sc.lids || sc.lids.includes(n.leafId)); }
const examPool = e => DB.notes.filter(n=>inScope(e,n));
const upcomingExams = () => DB.exams.filter(e=>e.date>=ymd()).sort((a,b)=>a.date.localeCompare(b.date));
const ddayLabel = date => { const k=dayDiff(date); return k===0?'D-DAY':k>0?'D-'+k:'D+'+(-k); };
function examLeaves(e){
  const out=[]; e.scope.forEach(sc=>{ const s=subjectById(sc.sid); if(!s) return; leaves(s).forEach(l=>{ if(!sc.lids||sc.lids.includes(l.id)) out.push({s,l}); }); });
  return out;
}
function examScopeLabel(e){
  return e.scope.map(sc=>{ const s=subjectById(sc.sid); if(!s) return ''; const L=leaves(s); return sc.lids&&sc.lids.length<L.length ? `${s.name} 일부(${sc.lids.length}단원)` : s.name; }).filter(Boolean).join(', ');
}
function examPlan(e){
  const t=ymd(), days=Math.max(1,dayDiff(e.date));
  const pool=examPool(e), active=pool.filter(n=>!n.graduated);
  const doneIds=new Set(DB.stats.reviews.filter(r=>r.d===t&&r.ex===e.id).map(r=>r.nid));
  // 시험까지 범위 오답을 두 바퀴 돌 수 있게 하루 몫을 나눈다
  const per=Math.min(active.length, Math.max(3, Math.ceil(active.length*2/days)));
  const last=n=>n.history.length?n.history[n.history.length-1].d:'';
  const order=active.filter(n=>!doneIds.has(n.id)).sort((a,b)=>last(a).localeCompare(last(b)) || (a.srs.streak||0)-(b.srs.streak||0));
  const left=Math.max(0, per-doneIds.size);
  const th=DB.settings.conceptThreshold, qd=new Set(DB.stats.quizzes.filter(q=>q.d===t).map(q=>q.lid));
  const weak=examLeaves(e).map(({s,l})=>({sid:s.id,lid:l.id,n:leafActive(s.id,l.id).length})).filter(w=>w.n>=th && !qd.has(w.lid)).sort((a,b)=>b.n-a.n).slice(0,2);
  return { pool, active, per, done:doneIds.size, items:[...order.slice(0,left).map(n=>({kind:'note',noteId:n.id})), ...weak.map(w=>({kind:'concept',sid:w.sid,lid:w.lid}))] };
}
function startExamReview(id){
  const e=examById(id), P=examPlan(e);
  if(!P.items.length){ toast(P.active.length?'오늘 몫은 다 했어요':'범위에 복습할 오답이 없어요'); return; }
  state.review=newSession(P.items,true); state.review.title=`${e.name} 대비`; state.review.exam=e.id; go('practice');
}

function fileBtns(slot, multiple){

  return `<label class="sbtn" ${k}>${svg(IC.camera,16)}촬영<input type="file" accept="image/*" capture="environment" hidden onchange="onFile('${slot}',this)"></label>`

async function onFile(slot, input){
  const files=[...input.files]; input.value='';
  try{
    for(const f of files){
      const d=await readImage(f);
      if(slot==='rev'){ runMineReview(d); return; }
      if(slot==='toc'){ if(state.toc && state.toc.images.length<4) state.toc.images.push(d); }
      else if(state.add) state.add.imgs[slot]=d;
    }
    render();
  }catch(e){ toast(e.message); }
}

function renderExam(){

  const grad=P.pool.length-P.active.length, left=P.items.filter(i=>i.kind==='note').length, qs=P.items.length-left;
  const th=DB.settings.conceptThreshold;
  const rows=examLeaves(e).map(({s,l})=>({s,l,n:leafActive(s.id,l.id).length,all:leafNotes(s.id,l.id).length})).sort((a,b)=>b.n-a.n||b.all-a.all);

    <button class="btn primary block" ${P.items.length?'':'disabled'} onclick="startExamReview('${e.id}')">${P.items.length?`${left?left+'문제 ':''}${qs?(left?'+ ':'')+'개념 질문 ':''}시작`:'오늘 몫 완료'}</button></div>`}
  <div class="kv3"><div><b>${P.pool.length}</b><span>범위 오답</span></div><div><b>${grad}</b><span>졸업</span></div><div><b>${P.active.length}</b><span>아직 남음</span></div></div>
  <div class="sec-head"><span>범위 단원 ${rows.length}</span>${P.pool.length?`<button class="link" onclick="go('print',{exam:'${e.id}'})">범위 오답 인쇄</button>`:''}</div>
  <div class="card">${rows.length?rows.slice(0,state.examAll?999:8).map(r=>`<button class="lrow" onclick="go('leaf',{sid:'${r.s.id}',lid:'${r.l.id}'})"><span><b>${esc(r.l.name)}</b><small>${esc(r.s.name)}${r.s.concepts[r.l.id]?' · 개념 정리 있음':''}</small></span>${r.n>=th?'<span class="badge new">약함</span>':''}<span class="pen n ${r.n?'':'zero'}">${r.n}</span></button>`).join('')

function examToggleSub(sid,on){ const s=subjectById(sid); if(on) EX.scope[sid]=leaves(s).map(l=>l.id); else delete EX.scope[sid]; refreshExamSheet(); }
function examToggleUnit(sid,uid_){

function saveExam(){
  const name=(EX.name||'').trim(); if(!name){ toast('시험 이름을 입력해주세요'); return; }

    .filter(sc=>sc.lids===null||sc.lids.length);
  if(!scope.length){ toast('시험 범위 과목을 하나 이상 골라주세요'); return; }
  if(EX.id){ Object.assign(examById(EX.id),{name,date:EX.date,courseId:EX.courseId,scope}); save(); closeSheet(); render(); toast('시험을 수정했어요'); return; }
  const e={id:uid('e_'),name,date:EX.date,courseId:EX.courseId,scope}; DB.exams.push(e); save(); closeSheet(); go('exam',{id:e.id}); toast('시험 일정을 추가했어요');

function normConcept(r){ return { summary:String(r.summary||''), points:arr(r.points).map(p=>({title:String(p.title||''),body:String(p.body||'')})),
  formulas:arr(r.formulas).map(String), mistakes:arr(r.mistakes).map(String), check:arr(r.check).map(String) }; }
async function genConceptRaw(s,l){ const r=await AI.task('summarizeConcepts',{s,l,courseId:s.courseId}); s.concepts[l.id]={...normConcept(r), at:Date.now(), demo:!AI.ready()}; save(); }
async function genConcept(sid,lid){
  const s=subjectById(sid), l=leafOf(s,lid); if(!l) return;
  state.busy[lid]=true; delete state.cerr[lid]; render();
  try{ await genConceptRaw(s,l); toast('개념 정리를 만들었어요'); }catch(e){ state.cerr[lid]=e.message; }
  delete state.busy[lid]; render();
}
async function genAllConcepts(sid){
  closeSheet(); if(state.bulk){ toast('이미 만드는 중이에요'); return; }
  const s=subjectById(sid), todo=leaves(s).filter(l=>!s.concepts[l.id]);
  if(!todo.length){ toast('모든 단원에 개념 정리가 있어요'); return; }
  if(AI.ready() && !confirm(`개념 정리가 없는 단원 ${todo.length}개를 차례로 만들어요. AI를 ${todo.length}번 호출해요. 계속할까요?`)) return;
  state.bulk={sid,done:0,total:todo.length}; render();
  for(const l of todo){
    if(state.bulk.stop) break;
    try{ await genConceptRaw(s,l); }catch(e){ toast(e.message); break; }
    state.bulk.done++; render();
  }
  const n=state.bulk.done; state.bulk=null; render(); if(n) toast(`개념 정리 ${n}개를 만들었어요`);
}

// ---- 개념 정리 모아보기 (탭)
function cvPick(){
  const V=state.cv;
  if(!courseById(V.course)) V.course=(DB.courses.find(c=>subjectsOf(c.id).some(s=>Object.keys(s.concepts).length))||DB.courses.find(c=>subjectsOf(c.id).length)||DB.courses[0]||{}).id||'';
  const subs=subjectsOf(V.course);
  if(!subs.some(s=>s.id===V.subject)) V.subject=(subs.find(s=>Object.keys(s.concepts).length)||subs.find(s=>leaves(s).length)||subs[0]||{}).id||'';
  return subs;
}
function openConcepts(sid){ const s=subjectById(sid); if(s){ state.cv.course=s.courseId; state.cv.subject=s.id; state.cv.q=''; } tab('concepts'); }
function renderConcepts(){
  appbar('개념 정리',{actions:gearBtn()});
  if(!DB.subjects.length) return `<div class="empty-card"><span class="pen">과목이 없어요</span><p>홈에서 교과를 고르고 과목을 추가하면 단원별 개념 정리를 모아볼 수 있어요.</p><button class="btn primary" onclick="tab('home')">홈으로</button></div>`;
  const V=state.cv, subs=cvPick();

    <div id="clist">${conceptListHTML()}</div>`;
}
function renderConceptList(){ const el=$('#clist'); if(el){ el.innerHTML=conceptListHTML(); typeset(el); } }
function conceptListHTML(){
  const V=state.cv, q=V.q.trim().toLowerCase();
  if(q){
    const hits=[];
    DB.subjects.forEach(s=>leaves(s).forEach(l=>{ const cp=s.concepts[l.id];
      const text=[l.name, l.unitName, s.name, ...(cp?[cp.summary, ...cp.points.map(p=>p.title+' '+p.body), ...cp.formulas, ...cp.mistakes]:[])].join(' ').toLowerCase();
      if(text.includes(q)) hits.push({s,l}); }));
    return hits.length ? `<div class="count">${hits.length}개 단원</div>${hits.map(h=>cvRow(h.s,h.l,true)).join('')}`
      : `<p class="empty" style="margin-top:12px">'${esc(V.q)}' 검색 결과가 없어요. 아직 정리를 만들지 않은 단원은 단원 이름으로만 찾을 수 있어요.</p>`;
  }
  const s=subjectById(V.subject);
  if(!s) return `<div class="empty-card"><span class="pen">이 교과엔 과목이 없어요</span><p>교과 화면에서 과목을 추가해주세요.</p><button class="btn primary" onclick="go('course',{id:'${V.course}'})">교과로 가기</button></div>`;
  const L=leaves(s);
  if(!L.length) return `<div class="empty-card"><span class="pen">단원 목차가 비어 있어요</span><p>목차 사진을 찍으면 AI가 단원을 채워줘요. 단원이 있어야 개념 정리를 만들 수 있어요.</p><button class="btn primary" onclick="startAddSubject('${s.courseId}','${s.id}')">단원 목차 채우기</button></div>`;
  const withC=L.filter(l=>s.concepts[l.id]).length, bulk=state.bulk&&state.bulk.sid===s.id?state.bulk:null;
  const groups=[]; L.forEach(l=>{ const g=groups[groups.length-1]; if(g&&g.name===l.unitName) g.list.push(l); else groups.push({name:l.unitName,list:[l]}); });
  return `<div class="cv-head"><div><b>${withC}/${L.length}</b> 단원 정리됨</div>${withC?`<button class="link" onclick="go('print',{csub:'${s.id}'})">${svg(IC.print,14)} 인쇄</button>`:''}</div>
    ${bulk?`<div class="card"><b>개념 정리 만드는 중 ${bulk.done}/${bulk.total}</b><div class="pbar"><i style="width:${bulk.done/bulk.total*100}%"></i></div><button class="link" onclick="state.bulk.stop=true;toast('지금 단원까지 만들고 멈춰요')">멈추기</button></div>`
      : withC<L.length?`<button class="btn ghost block" style="margin-bottom:6px" onclick="genAllConcepts('${s.id}')">${svg(IC.sparkle,16)} 남은 단원 ${L.length-withC}개 개념 정리 만들기</button>`:''}
    ${groups.map(g=>`<div class="cv-unit">${groups.length>1||g.list[0].name!==g.name?`<h3>${esc(g.name)}</h3>`:''}${g.list.map(l=>cvRow(s,l,false)).join('')}</div>`).join('')}`;
}
function cvRow(s, l, showPath){
  const cp=s.concepts[l.id], n=leafActive(s.id,l.id).length, all=leafNotes(s.id,l.id).length, th=DB.settings.conceptThreshold;
  const open=!!state.cv.open[l.id], busy=state.busy[l.id];
  const sub=(showPath?`${s.name} › `:'')+(busy?'정리하는 중…':cp?cp.points.map(p=>p.title).slice(0,3).join(' · '):'아직 정리 없음');
  let body='';
  if(open){
    if(busy) body=`<div class="loading" style="padding:16px 0"><div class="spin"></div>개념을 정리하는 중이에요</div>`;
    else if(cp) body=conceptHTML(cp)+`<div class="cv-acts">
        ${all?`<button class="sbtn" onclick="go('leaf',{sid:'${s.id}',lid:'${l.id}',tab:'notes'})">이 단원 오답 ${all}</button>`:''}

    else body=`<p class="help" style="margin:0 0 10px">AI가 이 단원의 핵심 개념, 공식, 자주 하는 실수를 한 장으로 정리해줘요.</p><button class="btn primary block" onclick="genConcept('${s.id}','${l.id}')">${svg(IC.sparkle,16)} AI로 개념 정리하기</button>`;
    if(state.cerr[l.id]) body+=`<div class="err"><b>개념 정리를 만들지 못했어요</b><p>${esc(state.cerr[l.id])}</p></div>`;
  }
  return `<div class="cv-item ${open?'open':''} ${cp?'':'none'}">
    <button class="cv-row" aria-expanded="${open}" onclick="state.cv.open['${l.id}']=!state.cv.open['${l.id}'];renderConceptList()">
      <span class="t"><b>${esc(l.name)}</b><small>${esc(sub)}</small></span>
      ${n>=th?`<span class="badge new">오답 ${n}</span>`:n?`<span class="cnt">오답 ${n}</span>`:''}
      <span class="chev ${open?'up':''}">›</span></button>

}
function renderLeaf(){
  const s=subjectById(route.sid), lf=leafOf(s,route.lid); if(!lf) return redirectHome();
  const c=courseById(s.courseId), ns=leafNotes(s.id,lf.id), t=route.tab||'concept', th=DB.settings.conceptThreshold;
  appbar(lf.name,{sub:esc([c&&c.name, s.name, lf.isUnit?'':lf.unitName].filter(Boolean).join(' › ')),back:true});
  const seg=`<div class="seg" role="tablist" style="margin-bottom:14px"><button role="tab" aria-selected="${t==='concept'}" class="${t==='concept'?'on':''}" onclick="route.tab='concept';render()">개념 정리</button><button role="tab" aria-selected="${t==='notes'}" class="${t==='notes'?'on':''}" onclick="route.tab='notes';render()">오답 ${ns.length}</button></div>`;
  const quiz = ns.length>=th
    ? `<div class="callout" style="margin-top:0"><span class="pen">오답이 ${ns.length}개 쌓였어요</span>문제만 다시 풀기보다 개념부터 점검해보세요.<br><button class="btn primary" style="margin-top:10px" onclick="startQuiz('${s.id}','${lf.id}')">개념 질문 받기</button></div>`
    : '';
  let body='';
  if(t==='concept'){
    const cp=s.concepts[lf.id];
    if(state.busy[lf.id]) body=`<div class="loading"><div class="spin"></div>개념을 정리하는 중이에요<p class="explain">${AI.ready()?'10~20초쯤 걸려요.':''}</p></div>`;
    else if(cp) body=conceptHTML(cp)+`<p class="explain">${cp.demo?'예시 모드로 만든 정리예요. ':''}${agoLabel(cp.at)} 만듦 · <button class="link" onclick="genConcept('${s.id}','${lf.id}')">다시 만들기</button></p>`;
    else body=`<div class="empty-card"><span class="pen">아직 개념 정리가 없어요</span><p>AI가 이 단원의 핵심 개념, 공식, 자주 하는 실수를 한 장으로 정리해줘요.</p><button class="btn primary" onclick="genConcept('${s.id}','${lf.id}')">${svg(IC.sparkle,16)} AI로 개념 정리하기</button></div>`;
    if(state.cerr[lf.id]) body+=`<div class="err"><b>개념 정리를 만들지 못했어요</b><p>${esc(state.cerr[lf.id])}</p><div class="acts"><button class="btn ghost" onclick="genConcept('${s.id}','${lf.id}')">다시 시도</button></div></div>`;
  } else {
    if(!ns.length) body=`<div class="empty-card"><span class="pen">이 단원 오답이 없어요</span><p>공부한 단원이라면 지금은 탄탄하다는 뜻이고, 아직 안 배운 단원이라면 비어 있는 게 정상이에요.</p><button class="btn primary" onclick="startAdd()">오답 추가하기</button></div>`;
    else {
      const types={}; ns.forEach(n=>types[n.type]=(types[n.type]||0)+1);
      const tl=Object.entries(types).sort((a,b)=>b[1]-a[1]), max=tl[0][1];
      body=`<div class="card">${tl.map(([ty,k])=>`<div class="trow"><div class="top"><span>${esc(ty)}</span><span class="pen">${k}</span></div><div class="track"><div class="fill" style="width:${k/max*100}%"></div></div></div>`).join('')}</div>${ns.map(rowHTML).join('')}`;
    }
  }
  const small = ns.length && ns.length<th ? `<button class="btn ghost block" style="margin-top:12px" onclick="startQuiz('${s.id}','${lf.id}')">개념 질문 받아보기</button>` : '';
  return quiz + seg + body + small;
}

function startAddSubject(courseId, subjectId){
  const s=subjectId && subjectById(subjectId);
  state.toc={courseId, subjectId:subjectId||null, step:s&&s.units.length?'edit':'method', images:[], name:s?s.name:'', units:s?clone(s.units):[], err:null, saveConcepts:false, fromAI:false, run:0};
  go('toc');
}
function tocManual(){ const T=state.toc; if(!T.units.length) T.units=[{id:'',name:'',subs:[]}]; T.fromAI=false; T.step='edit'; render(true); }
function tocBack(){
  const T=state.toc; if(!T){ back(); return; }
  if(T.step==='parsing'){ T.run++; T.step='photo'; render(true); return; }
  const isNewOrEmpty = !T.subjectId || !(subjectById(T.subjectId)||{units:[]}).units.length;
  if(T.step==='edit' && isNewOrEmpty){ if(T.units.some(u=>u.name.trim()) && !confirm('입력한 목차를 버리고 돌아갈까요?')) return; T.step='method'; render(true); return; }
  if(T.step==='photo' && isNewOrEmpty){ T.step='method'; render(true); return; }
  if(T.step==='photo'){ T.step='edit'; render(true); return; }
  state.toc=null; back();
}

      ${T.images.length?`<div class="thumbs">${T.images.map((d,i)=>`<div class="th"><img src="${d}" alt="목차 ${i+1}쪽"><button aria-label="${i+1}번째 사진 빼기" onclick="state.toc.images.splice(${i},1);render()">×</button></div>`).join('')}</div>`:'<p class="hint" style="margin-top:0">목차 전체가 보이고 글자가 흐리지 않게 찍어주세요. 여러 쪽이면 순서대로 넣어요.</p>'}
      ${T.images.length<4?`<div class="acts" style="flex-wrap:nowrap">${fileBtns('toc',true)}</div>`:''}
    </div>
    ${T.err?`<div class="err"><b>목차를 읽지 못했어요</b><p>${esc(T.err)}</p><div class="acts"><button class="btn ghost" onclick="tocManual()">직접 입력</button><button class="btn primary" onclick="runTOC()">다시 시도</button></div></div>`:''}
    <button class="btn primary block" ${T.images.length||!AI.ready()?'':'disabled'} onclick="runTOC()">${svg(IC.sparkle,16)} 목차 읽기</button>
    ${!T.images.length&&!AI.ready()?'<p class="help" style="text-align:center">예시 모드에서는 사진 없이도 예시 목차를 불러와요.</p>':''}`;
  // edit
  const total=T.units.reduce((a,u)=>a+Math.max(1,u.subs.length),0);
  return `${T.fromAI?'<div class="banner"><b>✓</b><span>AI가 읽은 목차예요. 틀린 글자나 빠진 단원이 있으면 고쳐주세요.</span></div>':''}
    <div class="card"><div class="field"><label for="tname">과목 이름</label><input id="tname" class="input" value="${esc(T.name)}" placeholder="예: 미적분" oninput="state.toc.name=this.value"></div></div>

        <button class="iconbtn sm" aria-label="위로 옮기기" onclick="tocMove(${i})" ${i?'':'disabled'}>${svg(IC.up,18)}</button>
        <button class="iconbtn sm" aria-label="대단원 삭제" onclick="tocDel(${i})">${svg(IC.x,18)}</button></div>
      ${u.subs.map((sb,j)=>`<div class="tree-row sub"><span class="tn">–</span><input class="input" value="${esc(sb.name)}" placeholder="소단원 이름" aria-label="소단원 이름" oninput="state.toc.units[${i}].subs[${j}].name=this.value"><button class="iconbtn sm" aria-label="소단원 삭제" onclick="tocDel(${i},${j})">${svg(IC.x,18)}</button></div>`).join('')}
      <button class="link" style="margin-left:26px" onclick="tocAddSub(${i})">+ 소단원</button>
    </div>`).join('')}
    <button class="btn ghost block" onclick="tocAddUnit()">+ 대단원 추가</button>

    <button class="btn primary block" onclick="saveToc()">저장</button>`;
}
function tocAddUnit(){ state.toc.units.push({id:'',name:'',subs:[]}); render(); const ins=document.querySelectorAll('.tree-row:not(.sub) .input'); ins[ins.length-1] && ins[ins.length-1].focus(); }
function tocAddSub(i){ state.toc.units[i].subs.push({id:'',name:''}); render(); const box=document.querySelectorAll('.tree-unit')[i]; const ins=box.querySelectorAll('.sub .input'); ins[ins.length-1] && ins[ins.length-1].focus(); }
function tocDel(i,j){ const u=state.toc.units[i]; if(j===undefined){ if((u.subs.length||u.name) && !confirm(`'${u.name||'이름 없음'}' 대단원${u.subs.length?'과 소단원 '+u.subs.length+'개':''}를 뺄까요?`)) return; state.toc.units.splice(i,1); } else u.subs.splice(j,1); render(); }
function tocMove(i){ const u=state.toc.units; [u[i-1],u[i]]=[u[i],u[i-1]]; render(); }
async function runTOC(){
  const T=state.toc, run=++T.run; T.step='parsing'; T.err=null; render(true);
  try{
    const r=await AI.task('parseTOC',{courseName:(courseById(T.courseId)||{}).name||'', images:T.images, courseId:T.courseId});
    if(state.toc!==T || T.run!==run) return;
    const nm=x=>String(typeof x==='string'?x:(x&&x.name)||'').trim();
    const units=arr(r.units).map(u=>({id:'',name:nm(u),subs:arr(u.subs).map(x=>({id:'',name:nm(x)})).filter(x=>x.name)})).filter(u=>u.name);
    if(!units.length) throw new Error('목차에서 단원을 찾지 못했어요. 목차가 잘 보이게 다시 찍어주세요.');
    T.units=units; if(!T.name.trim()) T.name=String(r.subject_name||'').trim(); T.fromAI=true; T.step='edit'; render(true);
  }catch(e){ if(state.toc!==T || T.run!==run) return; T.err=e.message; T.step='photo'; render(); }
}
function saveToc(){
  const T=state.toc, name=T.name.trim();
  if(!name){ toast('과목 이름을 입력해주세요'); const i=$('#tname'); i && i.focus(); return; }
  const old=T.subjectId && subjectById(T.subjectId);
  // 다시 읽은 목차에서도 이름이 같은 단원은 기존 id를 이어받아 오답 연결을 유지한다
  const byName={}, used=new Set();
  if(old){ leaves(old).forEach(l=>{ byName['l:'+l.name]=l.id; }); old.units.forEach(u=>{ byName['u:'+u.name]=u.id; }); }
  const pick=(id,key,p)=>{ let v=id||byName[key]; if(!v||used.has(v)) v=uid(p); used.add(v); return v; };
  const units=T.units.filter(u=>u.name.trim()).map(u=>{ const un=u.name.trim();
    const subs=u.subs.filter(x=>x.name.trim()).map(x=>({id:pick(x.id,'l:'+x.name.trim(),'l_'),name:x.name.trim()}));
    return {id:pick(u.id,'u:'+un,'u_'),name:un,subs}; });
  if(!units.length){ toast('단원을 하나 이상 입력해주세요'); return; }
  let sid;
  if(old){ old.name=name; old.units=units; sid=old.id; }
  else { const s={id:uid('s_'),courseId:T.courseId,name,units,concepts:{}}; DB.subjects.push(s); sid=s.id; }
  save();
  const gen=T.saveConcepts; state.toc=null;
  if(old){ route=state.stack.pop()||{name:'subject',id:sid}; if(route.name!=='subject') { state.stack.push(route); route={name:'subject',id:sid}; } }
  else route={name:'subject',id:sid};
  render(true); toast(old?'목차를 저장했어요':`'${name}' 과목을 추가했어요`);
  if(gen) genAllConcepts(sid);
}

const ANALYZE_STEPS=[['풀이 만들기','정답과 풀이를 만들고 단원과 유형을 골라요'],['유사문제 만들기','같은 개념, 다른 숫자로 새 문제를 만들어요'],['유사문제 검산하기','AI가 따로 다시 풀어 답이 같은지 확인해요']];
function ctxFromRoute(){
  if(route.name==='course') return route.sub?{courseId:route.id,subjectId:route.sub}:{courseId:route.id};
  if(route.name==='subject'){ const s=subjectById(route.id); return s?{courseId:s.courseId,subjectId:s.id}:{}; }
  if(route.name==='leaf'){ const s=subjectById(route.sid); return s?{courseId:s.courseId,subjectId:s.id,leafId:route.lid}:{}; }
  const last=DB.notes.slice().sort((a,b)=>b.createdAt-a.createdAt)[0];
  return last?{courseId:last.courseId,subjectId:last.subjectId}:{};
}
function startAdd(){
  const ctx=ctxFromRoute(), courseId=ctx.courseId||(DB.courses[0]||{}).id||'';
  let subjectId=ctx.subjectId||''; if(!subjectId){ const subs=subjectsOf(courseId); if(subs.length===1) subjectId=subs[0].id; }
  const last=DB.notes.slice().sort((a,b)=>b.createdAt-a.createdAt)[0];
  state.add={ step:'info', courseId, subjectId, leafId:ctx.leafId||null, imgs:{q:null,s:null,mine:null},
    meta:{workbook:last?last.workbook:'', page:'', number:'', tags:[]}, draft:null, err:null, prog:0, editing:false, figOn:false, crop:null, run:0, multi:false };
  state.batch=null;
  go('add');
}

async function startRegions(){
  const a=state.add; if(!a.subjectId){ toast('과목을 먼저 골라주세요'); return; }
  if(!a.imgs.q){ if(AI.ready()){ toast('문제 페이지 사진을 넣어주세요'); return; } a.imgs.q=demoPage(); }
  a.step='regions'; a.regions=[]; a.detecting=true; a.detErr=null; render(true);
  try{
    const r=await AI.task('detectProblems',{images:[a.imgs.q], courseId:a.courseId});
    if(state.add!==a) return;
    const ps=arr(r.problems).map(p=>({box:validBox(p.box), number:String(p.number||'').trim(), marked:!!p.marked})).filter(p=>p.box);
    const anyMarked=ps.some(p=>p.marked);
    a.regions=ps.map(p=>({...p.box, number:p.number, on:anyMarked?p.marked:true}));
    if(!a.regions.length) a.detErr='문제 위치를 찾지 못했어요. 영역을 직접 추가해주세요.';
  }catch(e){ if(state.add!==a) return; a.detErr=e.message; }
  a.detecting=false; render();
}
function addRegion(){ const a=state.add, n=a.regions.length; a.regions.push({x:10+(n%3)*8,y:10+(n%3)*8,w:60,h:30,number:'',on:true}); render(); }
function renderRegions(a){

  if(a.detecting) return `<div class="loading"><div class="spin"></div>페이지에서 문제를 찾는 중이에요</div>`;
  const on=a.regions.filter(r=>r.on).length;
  return `${a.detErr?`<div class="warn">${esc(a.detErr)}</div>`:`<p class="hint" style="margin-top:0">AI가 찾은 문제예요. ${a.regions.some(r=>!r.on)?'틀린 표시가 있는 문제만 골라뒀어요. ':''}정리할 문제만 체크하고, 상자는 끌어서 고쳐요.</p>`}

      ${a.regions.map((r,i)=>`<div class="cropbox m ${r.on?'':'off'}" data-i="${i}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%"><span class="lab">${esc(r.number||'?')}번</span><span class="h"></span></div>`).join('')}</div>
    <div class="card" style="margin-top:12px">${a.regions.map((r,i)=>`<div class="reg-row"><label class="check"><input type="checkbox" ${r.on?'checked':''} onchange="state.add.regions[${i}].on=this.checked;render()"> 정리</label>
      <input class="input" aria-label="문제 번호" value="${esc(r.number)}" placeholder="번호" oninput="state.add.regions[${i}].number=this.value;document.querySelector('.cropbox[data-i=&quot;${i}&quot;] .lab').textContent=(this.value||'?')+'번'">
      <button class="sbtn" aria-label="영역 삭제" onclick="state.add.regions.splice(${i},1);render()">삭제</button></div>`).join('')||'<p class="empty">영역이 없어요.</p>'}

<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 오답노트 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" defer></script>
<style>
:root{
  --paper:#F7F8FA; --surface:#FFFFFF; --grid:#E4E9F3; --ink:#1B2A4A; --muted:#5F6B85;
  --blue:#2747C9; --blue-soft:#E7ECFF; --red:#D6303B; --red-soft:#FDE8EA;
  --hl:rgba(255,222,64,.55); --line:#D8DEEA; --ok:#1E8C55; --ok-soft:#E3F5EB;
  --desk:#DCE2EE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131824; --surface:#1B2232; --grid:#222B3E; --ink:#E6EAF3; --muted:#9AA5BE;
    --blue:#8EA2FF; --blue-soft:#25304F; --red:#FF7272; --red-soft:#3A2228;
    --hl:rgba(255,214,0,.22); --line:#2C3549; --ok:#5ED39A; --ok-soft:#1D3328;
    --desk:#0C0F16; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131824; --surface:#1B2232; --grid:#222B3E; --ink:#E6EAF3; --muted:#9AA5BE;
  --blue:#8EA2FF; --blue-soft:#25304F; --red:#FF7272; --red-soft:#3A2228;
  --hl:rgba(255,214,0,.22); --line:#2C3549; --ok:#5ED39A; --ok-soft:#1D3328;
  --desk:#0C0F16; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--desk);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pen{font-family:"Nanum Pen Script","Comic Sans MS",cursive;font-weight:400}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}
.aside{max-width:300px;color:var(--muted);font-size:14px}
.aside h1{font-size:22px;color:var(--ink);margin:0 0 8px;line-height:1.35}
.aside p{margin:0 0 12px}
.aside .pen{font-size:26px;color:var(--red);line-height:1.1}

.phone{width:390px;height:820px;max-height:calc(100vh - 48px);background:var(--paper);
  border-radius:36px;border:10px solid #1a1d24;position:relative;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(10,20,50,.45)}
.grid-bg{background-image:
  linear-gradient(var(--grid) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.statusbar{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;background:var(--paper);flex:none}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;background:var(--paper);flex:none;border-bottom:1px solid var(--line)}
.appbar h2{font-size:18px;margin:0;flex:1;font-weight:700}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:var(--blue-soft)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 96px;position:relative}
.nav{position:absolute;left:0;right:0;bottom:0;height:68px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:4px}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.nav button.on{color:var(--blue);font-weight:600}
.nav svg{width:22px;height:22px}
.fab{position:absolute;right:18px;bottom:84px;width:58px;height:58px;border-radius:18px;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(214,48,59,.6);z-index:5}
.fab svg{width:26px;height:26px}

.sim-note{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px}

/* home */
.today{background:var(--surface);border:1.5px solid var(--ink);border-radius:6px 18px 6px 18px;padding:18px;margin-bottom:18px;position:relative}
.today .big{font-size:44px;line-height:1;color:var(--red)}
.today p{margin:6px 0 14px;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1430}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1430}}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px}

.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 4px;text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
.row:first-of-type{border-top:1px solid var(--line)}
.row .tag{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--red);color:var(--red);display:grid;place-items:center;font-size:19px;line-height:1;transform:rotate(-8deg)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12px;color:var(--muted)}
.row .when{font-size:12px;color:var(--muted);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* capture */
.slot{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.slot h3{margin:0 0 2px;font-size:15px}
.slot p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot .thumb{border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px}
.slot .actions{display:flex;gap:8px}
.slot .actions .btn{flex:1;padding:10px;font-size:14px}
.optional{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}

/* crop */
.cropwrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);touch-action:none;user-select:none}
.cropbox{position:absolute;border:2px solid var(--blue);box-shadow:0 0 0 9999px rgba(10,15,30,.45);cursor:move}
.cropbox .h{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--blue);border:2px solid #fff;cursor:nwse-resize}
.cropbox .lab{position:absolute;left:-2px;top:-26px;background:var(--blue);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px 6px 0 0;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:10px 0 14px}

/* analyze */
.steps{list-style:none;padding:0;margin:24px 0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;color:var(--muted);transition:color .3s}
.steps li .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.steps li.doing{color:var(--ink)}
.steps li.doing .dot{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.steps li small{display:block;font-size:12px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}

/* note */
.note{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 16px;position:relative;margin-bottom:14px}
.stamp{display:inline-block;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 10px;font-size:24px;line-height:1.3;transform:rotate(-3deg);margin-bottom:8px}
.type-line{font-weight:700;font-size:17px;margin:2px 0 6px;line-height:1.4}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;vertical-align:2px;margin-left:4px}
.badge.new{background:var(--red-soft);color:var(--red)}
.badge.match{background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.concepts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.concepts span{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.qtext{margin:0 0 10px}
.qtext .num{font-weight:700;margin-right:4px}
.fig{display:flex;justify-content:center;margin:6px 0 12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:4px 10px;font-size:14px;margin-bottom:6px}
.choices span{position:relative;padding:2px 0}
.choices .ans::before{content:"";position:absolute;left:-6px;top:-3px;width:34px;height:30px;border:2px solid var(--red);border-radius:50%;transform:rotate(-10deg)}
.choices .mine{text-decoration:line-through;text-decoration-color:var(--muted)}
.legend{font-size:12px;color:var(--muted);margin-bottom:6px}
.divider{border:0;border-top:1px dashed var(--line);margin:14px 0}
.sol h4{margin:0 0 8px;font-size:14px}
.sol ol{margin:0;padding-left:20px}
.sol li{margin-bottom:6px}
.key{margin-top:12px;font-weight:600;line-height:1.7}
.key mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 2px}
.key .pen{color:var(--red);font-size:22px;font-weight:400;margin-right:4px}
.toggle{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:600;padding:6px 0}
pre.json{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;margin:6px 0 0}
.explain{font-size:12px;color:var(--muted);margin:4px 0 0}

/* review */
.progress{display:flex;gap:4px;margin-bottom:14px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--blue)}
.from{font-size:12px;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;position:relative}
.opt .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.mark{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:34px;line-height:1}
.verdict{border-radius:12px;padding:14px;margin-bottom:12px}
.verdict.good{background:var(--ok-soft)}
.verdict.bad{background:var(--red-soft)}
.verdict .pen{font-size:30px;line-height:1}
.verdict p{margin:4px 0 0;font-size:14px}
.done-card{text-align:center;padding:40px 10px}
.done-card .pen{font-size:54px;color:var(--red);line-height:1.1;display:block;margin-bottom:10px}

/* stats */
.bars{display:flex;flex-direction:column;gap:12px;margin:8px 0 6px}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .track{height:12px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:3px}
.bar.top .fill{background:var(--red)}
.callout{background:var(--surface);border-left:4px solid var(--red);padding:12px 14px;margin:18px 0;font-size:14px}
.callout .pen{font-size:24px;color:var(--red);display:block;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kv b{font-size:24px;display:block;line-height:1.2}
.kv span{font-size:12px;color:var(--muted)}

.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* map */
:root{--h0:var(--surface);--h1:#FDE3E5;--h2:#F3A3AA;--h3:#D6303B;--h3t:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--h1:#3A2228;--h2:#7A3540;--h3:#FF7272;--h3t:#2a0d10}}
:root[data-theme="dark"]{--h1:#3A2228;--h2:#7A3540;--h3:#FF7272;--h3t:#2a0d10}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.kv3 div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.kv3 b{font-size:20px;display:block;line-height:1.2}
.kv3 span{font-size:11px;color:var(--muted)}
.subject{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 12px 6px;margin-top:14px}
.subject h3{margin:0 0 10px;font-size:16px}
.unit{margin-bottom:12px}
.unit .ul{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
.unit .ul b{color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tile{border:1px solid var(--line);border-radius:6px;padding:6px 6px 4px;min-height:62px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--h0)}
.tile small{font-size:10.5px;line-height:1.3;word-break:keep-all}
.tile .c{font-size:20px;line-height:1;align-self:flex-end}
.tile.l1{background:var(--h1);border-color:transparent}
.tile.l2{background:var(--h2);border-color:transparent}
.tile.l3{background:var(--h3);border-color:transparent;color:var(--h3t)}
.tile.l0 .c{color:var(--muted);opacity:.5}
.tile.sel{outline:2.5px solid var(--blue);outline-offset:1px}
.legend2{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:10px 0 0;justify-content:flex-end}
.legend2 i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.detail{background:var(--surface);border:1.5px solid var(--blue);border-radius:4px;padding:14px;margin-top:14px}
.detail .crumb{font-size:12px;color:var(--muted)}
.detail h4{margin:2px 0 10px;font-size:17px}
.trow{padding:10px 0;border-top:1px dashed var(--line)}
.trow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.trow .top .pen{color:var(--red);font-size:22px;font-weight:400;line-height:1}
.trow .track{height:8px;border-radius:2px;background:var(--grid);margin:6px 0}
.trow .fill{height:100%;border-radius:2px;background:var(--red)}
.link{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:600;padding:2px 0}
.empty{font-size:14px;color:var(--muted);margin:0}
.filterbar{display:flex;align-items:center;gap:8px;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.filterbar span{flex:1}

@media (max-width:820px){ .aside{display:none} }
@media (max-width:500px){
  body{background:var(--surface)}
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="stage">
  <div class="aside">
    <h1>AI 오답노트 프로토타입</h1>
    <p>완성된 앱이 어떤 흐름으로 움직이는지 미리 만져보는 시뮬레이션입니다. AI 응답은 미리 준비한 예시이고, 실제 앱에서는 이 자리에 모델 호출이 들어갑니다.</p>
    <p>추천 순서: 오른쪽 아래 빨간 버튼으로 오답 추가 → 정리 결과 확인 → 복습 탭에서 유사문제 풀기 → 통계 확인</p>
    <p class="pen">결과 화면의 'AI가 돌려준 데이터 보기'도 열어보세요</p>
  </div>
  <div class="phone" id="phone">
    <div class="statusbar"><span>9:41</span><span>5G ▮▮▮ 82%</span></div>
    <div class="appbar" id="appbar"></div>
    <div class="screen grid-bg" id="screen"></div>
    <button class="fab" id="fab" aria-label="오답 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <nav class="nav" id="nav"></nav>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

// ---------- sample data ----------
// 교과서 목차 예시. 실제 앱에서는 학생 교과서 목차로 바꿔 넣는다.
const MAP = [
  { subject:'공통수학1', units:[
    { name:'다항식', subs:[
      { name:'다항식의 연산', types:[] },
      { name:'나머지정리', types:[{t:'이차식으로 나눈 나머지 구하기',n:2},{t:'나머지정리로 미정계수 구하기',n:1}] },
      { name:'인수분해', types:[] } ]},
    { name:'방정식과 부등식', subs:[
      { name:'복소수와 이차방정식', types:[{t:'판별식으로 근 판별하기',n:1}] },
      { name:'이차방정식과 이차함수', types:[{t:'제한된 범위에서 이차함수의 최대와 최소',n:3},{t:'이차함수 그래프와 직선의 위치 관계',n:1}] },
      { name:'여러 가지 방정식과 부등식', types:[] } ]},
    { name:'경우의 수', subs:[
      { name:'경우의 수', types:[] },
      { name:'순열과 조합', types:[{t:'이웃하지 않게 세우기',n:2}] } ]},
    { name:'행렬', subs:[ { name:'행렬과 그 연산', types:[] } ]} ]},
  { subject:'공통수학2', units:[
    { name:'도형의 방정식', subs:[
      { name:'평면좌표', types:[] },
      { name:'직선의 방정식', types:[{t:'점과 직선 사이의 거리',n:1}] },
      { name:'원의 방정식', types:[] },
      { name:'도형의 이동', types:[] } ]},
    { name:'집합과 명제', subs:[ { name:'집합', types:[] }, { name:'명제', types:[] } ]},
    { name:'함수와 그래프', subs:[ { name:'함수', types:[] }, { name:'유리함수와 무리함수', types:[] } ]} ]}
];
const SUB_TOTAL = MAP.reduce((a,s)=>a+s.units.reduce((b,u)=>b+u.subs.length,0),0);

function renderCrop(){

  </div>
  <div style="display:flex;gap:8px;margin-top:16px">

function bindCrop(){
  const wrap=$('#cropwrap'), box=$('#cropbox'), h=$('#crophandle'); if(!wrap) return;
  let mode=null, sx, sy, start;
  const down=(m)=>e=>{ e.preventDefault(); e.stopPropagation(); mode=m; sx=e.clientX; sy=e.clientY; start={...crop}; box.setPointerCapture(e.pointerId); };
  box.addEventListener('pointerdown', down('move'));
  h.addEventListener('pointerdown', down('resize'));
  box.addEventListener('pointermove', e=>{
    if(!mode) return; const r=wrap.getBoundingClientRect();
    const dx=(e.clientX-sx)/r.width*100, dy=(e.clientY-sy)/r.height*100;
    if(mode==='move'){ crop.x=Math.min(Math.max(0,start.x+dx),100-crop.w); crop.y=Math.min(Math.max(0,start.y+dy),100-crop.h); }
    else { crop.w=Math.min(Math.max(15,start.w+dx),100-crop.x); crop.h=Math.min(Math.max(15,start.h+dy),100-crop.y); }
    Object.assign(box.style,{left:crop.x+'%',top:crop.y+'%',width:crop.w+'%',height:crop.h+'%'});
  });
  const up=()=>{mode=null};
  box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
}

const ANALYZE_STEPS = [
  ['문제와 해설 글자 읽기','사진 속 글자와 수식을 옮겨 적어요'],
  ['수식 정리하기','읽은 수식을 교과서처럼 보기 좋게 바꿔요'],
  ['단원 고르기','교과서 목차의 소단원 '+SUB_TOTAL+'개 중에서만 골라요'],
  ['유형 맞추기','지금까지 저장한 유형 4개와 비교해요'],
  ['유사문제 만들고 검산하기','AI가 두 번 따로 풀어 답이 같은지 확인해요']
];
function analyze(){
  state.add.step='analyze'; state.add.done=0; render();
  const tick=()=>{ if(!state.add||state.add.step!=='analyze') return;
    state.add.done++; render();
    if(state.add.done<ANALYZE_STEPS.length) setTimeout(tick, 750);
    else setTimeout(()=>{ if(state.add){ state.add.step='result'; render(); $('#screen').scrollTop=0; } }, 500); };
  setTimeout(tick, 750);
}
function renderAnalyze(){
  appbar('정리하는 중');
  const d=state.add.done;
  return `<ul class="steps">${ANALYZE_STEPS.map(([t,s],i)=>`<li class="${i<d?'done':i===d?'doing':''}"><span class="dot">${i<d?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"><path d="M5 12l5 5 9-10"/></svg>':''}</span><span>${t}<small>${s}</small></span></li>`).join('')}</ul>
  <p class="hint">실제 앱에서는 이 단계가 AI 호출 1~2번으로 끝나요.</p>`;
}
function renderResult(){
  appbar('정리 결과', "state.add.step='crop';render()");
  const n={...NEW_NOTE, fig: state.add.fig?FIG:null};
  const json = JSON.stringify({
    chapter:n.chapter, chapter_from_list:true,
    type:n.type, type_match:'existing',
    concepts:n.concepts,
    problem_md:'그림은 이차함수 $f(x)=x^2-4x+a$의 그래프이다. ...',
    choices:['-4','-3','-2','-1','0'], answer_index:2, student_answer_index:4,
    figure_box: state.add.fig?{x:+crop.x.toFixed(1),y:+crop.y.toFixed(1),w:+crop.w.toFixed(1),h:+crop.h.toFixed(1)}:null,
    solution_steps:['f(x)=(x-2)^2+a-4 ...','...'],
    key_point:'꼭짓점이 범위 안에 있으면 ...',
    similar:{ verified:true, solve_runs:[ 6, 6 ] }
  }, null, 2);
  return `${noteHTML(n,{analysis:true})}
  <div class="note" style="padding:12px 16px">
    <span class="badge ok" style="margin:0">유사문제 1개 준비됨</span>
    <p class="explain" style="margin-top:6px">AI가 만든 유사문제를 따로 두 번 풀어 답이 같은 것만 남겼어요. 내일 복습에 나와요.</p>
  </div>
  <button class="toggle" onclick="const p=document.getElementById('orig');p.hidden=!p.hidden">원본 사진과 비교하기</button>
  <div id="orig" hidden style="margin-bottom:8px">${PHOTO_Q}</div><br>
  <button class="toggle" onclick="const p=document.getElementById('raw');p.hidden=!p.hidden">AI가 돌려준 데이터 보기</button>
  <div id="raw" hidden><pre class="json">${json.replace(/</g,'&lt;')}</pre>
  <p class="explain">앱은 AI에게 이런 형식으로만 답하라고 요청하고, 이 데이터를 받아 위 화면을 그려요. 단원은 정해진 목록에서만 고르게 하고, 유형은 저장된 유형과 먼저 비교하게 해서 같은 유형이 여러 이름으로 쪼개지지 않게 해요.</p></div>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn ghost" style="flex:1" onclick="toast('시뮬레이션에서는 수정 화면이 생략돼 있어요')">수정</button>
    <button class="btn primary" style="flex:2" onclick="saveNew()">오답노트에 저장</button>
  </div>`;
}
function saveNew(){ state.saved=true; state.add=null; state.tab='notes'; state.filter='전체'; render(); toast('오답노트에 저장했어요'); }

// ---------- review ----------
function renderReview(){
  const queue = state.single ? [state.single] : reviewQueue();
  appbar(state.single?'유사문제':'오늘 복습', state.single?"state.single=null;go('notes')":null);
  if(state.reviewIdx>=queue.length){
    const right = state.reviewLog.filter(Boolean).length;
    return `<div class="done-card"><span class="pen">${right} / ${queue.length} 정답</span>
      <p style="color:var(--muted);margin:0 0 20px">맞힌 유형은 복습 간격이 길어지고, 틀린 유형은 내일 다시 나와요.</p>
      <button class="btn primary" onclick="state.single=null;go('${state.single?'notes':'home'}')">${state.single?'오답노트로':'홈으로'}</button></div>`;
  }
  const id = queue[state.reviewIdx], src = allNotes().find(n=>n.id===id), p = SIMILAR[id], picked = state.reviewPicked;
  const bars = queue.map((_,i)=>`<i class="${i<=state.reviewIdx?'on':''}"></i>`).join('');
  let verdict='';
  if(picked!==null){
    const ok = picked===p.answer;
    verdict = `<div class="verdict ${ok?'good':'bad'}"><span class="pen" style="color:${ok?'var(--ok)':'var(--red)'}">${ok?'맞았어요':'다시 볼 문제'}</span>
      <p>${ok?'다음 복습은 7일 뒤예요.':'원래 오답과 같은 실수인지 풀이를 확인해보세요. 내일 다시 나와요.'}</p></div>
      <div class="note"><div class="sol"><h4>풀이</h4><p style="margin:0">${p.sol}</p></div>
      <div class="key"><span class="pen">원래 오답에서 기억할 것</span><mark>${src.key}</mark></div></div>
      <button class="btn primary block" onclick="state.reviewLog.push(${ok});state.reviewIdx++;state.reviewPicked=null;render();$('#screen').scrollTop=0">${state.reviewIdx+1<queue.length?'다음 문제':'결과 보기'}</button>`;
  }
  return `<div class="progress">${bars}</div>
    <div class="from">${src.chapter} / ${src.type} <span class="badge ok">검산 통과</span></div>
    <div class="note"><p class="qtext">${p.text}</p></div>
    <div class="opts">${p.choices.map((c,i)=>{
      let cls='', mark='';
      if(picked!==null){ if(i===p.answer){cls='right';mark='<span class="mark pen" style="color:var(--ok)">O</span>';} else if(i===picked){cls='wrong';mark='<span class="mark pen" style="color:var(--red)">/</span>';} }
      return `<button class="opt ${cls}" ${picked!==null?'disabled':''} onclick="state.reviewPicked=${i};render()"><span class="n">${i+1}</span>${c}${mark}</button>`;}).join('')}</div>
    ${verdict}`;
}

// ---------- map ----------
function mapData(){
  return MAP.map(sj=>({...sj, units:sj.units.map(u=>({...u, subs:u.subs.map(sb=>({...sb,
    types:sb.types.map(t=>({...t, n:t.n+(state.saved&&t.t===NEW_NOTE.type?1:0)}))}))}))}));
}
const subN = sb => sb.types.reduce((a,t)=>a+t.n,0);
function hot(){
  let best={n:-1};
  mapData().forEach(sj=>sj.units.forEach(u=>u.subs.forEach(sb=>sb.types.forEach(t=>{ if(t.n>best.n) best={n:t.n,t:t.t,sub:sb.name,unit:u.name}; }))));
  return best;
}
const lvl = n => n===0?0 : n===1?1 : n<=3?2 : 3;
function openType(sub,type){ state.filter=allNotes().some(n=>n.chapter===sub)?sub:'전체'; state.filterType=type; state.tab='notes'; state.add=null; render(); $('#screen').scrollTop=0; }
function renderMap(){
  appbar('단원 지도');
  const data=mapData();
  let total=0, withErr=0, sel=null, selUnit=null;
  data.forEach(sj=>sj.units.forEach(u=>u.subs.forEach(sb=>{ const n=subN(sb); total+=n; if(n) withErr++; if(sb.name===state.mapSel){sel=sb;selUnit=u.name;} })));
  const h=hot();
  const subjects=data.map(sj=>`<section class="subject"><h3>${sj.subject}</h3>
    ${sj.units.map(u=>{ const un=u.subs.reduce((a,sb)=>a+subN(sb),0);
      return `<div class="unit"><div class="ul"><b>${u.name}</b><span>${un?un+'문제':'오답 없음'}</span></div>
      <div class="tiles">${u.subs.map(sb=>{const n=subN(sb);
        return `<button class="tile l${lvl(n)} ${sb.name===state.mapSel?'sel':''}" onclick="state.mapSel='${sb.name}';render();document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'})" aria-label="${sb.name} 오답 ${n}문제"><small>${sb.name}</small><span class="c pen">${n}</span></button>`;}).join('')}</div></div>`;}).join('')}
    </section>`).join('');
  const maxN=Math.max(1,...sel.types.map(t=>t.n));
  const detail=`<section class="detail" id="detail"><div class="crumb">${selUnit}</div><h4>${sel.name}</h4>
    ${sel.types.length? sel.types.slice().sort((a,b)=>b.n-a.n).map(t=>`<div class="trow"><div class="top"><span>${t.t}</span><span class="pen">${t.n}</span></div>
      <div class="track"><div class="fill" style="width:${t.n/maxN*100}%"></div></div>
      <button class="link" onclick="openType('${sel.name}','${t.t}')">이 유형 오답 보기</button></div>`).join('')
      : '<p class="empty">이 단원은 아직 모은 오답이 없어요. 공부한 단원이라면 지금은 탄탄하다는 뜻이고, 아직 안 배운 단원이라면 비어 있는 게 정상이에요.</p>'}
  </section>`;
  return `<div class="kv3"><div><b>${total}</b><span>모은 오답</span></div><div><b>${withErr}/${SUB_TOTAL}</b><span>오답 있는 단원</span></div><div><b>68%</b><span>유사문제 정답률</span></div></div>
    <div class="callout"><span class="pen">가장 많이 쌓인 유형</span>${h.unit} / ${h.sub}<br><b>${h.t}</b> ${h.n}문제<br><button class="link" onclick="openType('${h.sub}','${h.t}')">이 유형 오답 보기</button></div>
    ${subjects}
    <div class="legend2">오답 수 <i style="background:var(--h0)"></i>0 <i style="background:var(--h1);border-color:transparent"></i>1 <i style="background:var(--h2);border-color:transparent"></i>2~3 <i style="background:var(--h3);border-color:transparent"></i>4+</div>
    ${detail}
    <p class="explain" style="margin-top:12px">단원을 누르면 그 안의 유형별 오답 수가 아래에 나와요. 목차는 예시이고, 실제로는 학생 교과서 목차를 그대로 넣어요.</p>`;
}

// ---------- render ----------
function render(){
  let html='';
  if(state.add){
    html = state.add.step==='capture'?renderCapture() : state.add.step==='crop'?renderCrop() : state.add.step==='analyze'?renderAnalyze() : renderResult();
  } else if(state.tab==='home') html=renderHome();
  else if(state.tab==='notes') html=renderNotes();
  else if(state.tab==='detail') html=renderDetail();
  else if(state.tab==='review') html=renderReview();
  else if(state.tab==='map') html=renderMap();
  $('#screen').innerHTML=html;
  nav();
  if(state.add && state.add.step==='crop') bindCrop();
  typeset();
}
$('#fab').addEventListener('click', startAdd);
window.addEventListener('load', ()=>{ render(); });
render();
</script>
</body>
</html>
